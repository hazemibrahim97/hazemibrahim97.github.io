": "SCANDAL"}, {"topic": "SOCIAL", "target": "ORDINARY", "deservedness": "NONE", "event_class": "HARDSHIP"}, {"topic": "SOCIAL", "target": "GROUP", "deservedness": "UNDESERVED", "event_class": "HARDSHIP"}, {"topic": "CELEBRITY", "target": "FIGURE", "deservedness": "DESERVED", "event_class": "SCANDAL"}, {"topic": "POLITICAL", "target": "ORDINARY", "deservedness": "NONE", "event_class": "SCANDAL"}, {"topic": "SOCIAL", "target": "ORDINARY", "deservedness": "UNDESERVED", "event_class": "DEATH"}, {"topic": "POLITICAL", "target": "FIGURE", "deservedness": "DESERVED", "event_class": "SCANDAL"}, {"topic": "SOCIAL", "target": "ORDINARY", "deservedness": "DESERVED", "event_class": "SCANDAL"}, {"topic": "POLITICAL", "target": "FIGURE", "deservedness": "DESERVED", "event_class": "SCANDAL"}, {"topic": "NATURAL", "target": "ORG", "deservedness": "NONE", "event_class": "ACCIDENT"}, {"topic": "PERSONAL", "target": "ORDINARY", "deservedness": "UNDESERVED", "event_class": "HARDSHIP"}, {"topic": "SOCIAL", "target": "ORDINARY", "deservedness": "UNDESERVED", "event_class": "HARDSHIP"}, {"topic": "CELEBRITY", "target": "FIGURE", "deservedness": "DESERVED", "event_class": "SCANDAL"}, {"topic": "PERSONAL", "target": "FIGURE", "deservedness": "DESERVED", "event_class": "SCANDAL"}, {"topic": "PERSONAL", "target": "ORDINARY", "deservedness": "UNDESERVED", "event_class": "DEATH"}, {"topic": "POLITICAL", "target": "FIGURE", "deservedness": "UNDESERVED", "event_class": "DEATH"}, {"topic": "POLITICAL", "target": "ORG", "deservedness": "NONE", "event_class": "SCANDAL"}, {"topic": "CELEBRITY", "target": "FIGURE", "deservedness": "UNDESERVED", "event_class": "HARDSHIP"}, {"topic": "ECONOMIC", "target": "ORG", "deservedness": "NONE", "event_class": "HARDSHIP"}, {"topic": "CELEBRITY", "target": "FIGURE", "deservedness": "UNDESERVED", "event_class": "ACCIDENT"}, {"topic": "PERSONAL", "target": "FIGURE", "deservedness": "NONE", "event_class": "SCANDAL"}, {"topic": "POLITICAL", "target": "FIGURE", "deservedness": "UNDESERVED", "event_class": "DEATH"}, {"topic": "POLITICAL", "target": "FIGURE", "deservedness": "NONE", "event_class": "SCANDAL"}, {"topic": "POLITICAL", "target": "ORG", "deservedness": "UNDESERVED", "event_class": "HARDSHIP"}, {"topic": "POLITICAL", "target": "GROUP", "deservedness": "NONE", "event_class": "ACCIDENT"}, {"topic": "ECONOMIC", "target": "ORDINARY", "deservedness": "NONE", "event_class": "SCANDAL"}, {"topic": "ECONOMIC", "target": "ORG", "deservedness": "DESERVED", "event_class": "SCANDAL"}, {"topic": "ECONOMIC", "target": "ORG", "deservedness": "DESERVED", "event_class": "SCANDAL"}, {"topic": "PERSONAL", "target": "ORDINARY", "deservedness": "UNDESERVED", "event_class": "DEATH"}, {"topic": "PERSONAL", "target": "ORG", "deservedness": "UNDESERVED", "event_class": "SCANDAL"}, {"topic": "ECONOMIC", "target": "ORG", "deservedness": "UNDESERVED", "event_class": "HARDSHIP"}, {"topic": "PERSONAL", "target": "ORDINARY", "deservedness": "DESERVED", "event_class": "DEATH"}, {"topic": "PERSONAL", "target": "ORDINARY", "deservedness": "UNDESERVED", "event_class": "DEATH"}, {"topic": "POLITICAL", "target": "ORDINARY", "deservedness": "UNDESERVED", "event_class": "ACCIDENT"}];   // review build only: LLM fields per post

const CLABELS = [
  ["SCH", "Schadenfreude — pleasure, amusement, gloating, mockery at the misfortune"],
  ["HOS", "Hostile without pleasure — anger, condemnation, insult, no enjoyment"],
  ["SYM", "Sympathetic — empathy, support, condolence"],
  ["NEU", "Neutral — factual, off-topic, tags, questions"],
  ["UNK", "Unknown — genuinely unclassifiable (use sparingly)"]];
const PFIELDS = [
  ["topic", "Topic", "123456789",
    [["POLITICAL","political/institutional"],["MORAL","moral/ideological"],["ECONOMIC","economic/corporate"],
     ["SOCIAL","social/group-level"],["CELEBRITY","celebrity/cultural"],["SPORTS","sports"],
     ["PERSONAL","personal/everyday"],["NATURAL","natural/environmental"],["OTHER","fits none"]]],
  ["target", "Target — who suffers", "qwer",
    [["ORDINARY","private individual/family"],["FIGURE","public figure"],["ORG","company/agency/institution"],["GROUP","a collective or category of people"]]],
  ["deservedness", "Deservedness — how the POST frames it, not your view", "asd",
    [["DESERVED","framed as brought on by target's own conduct"],["UNDESERVED","framed as innocent victim"],["NONE","post takes no position"]]],
  ["event_class", "Event class — what the headline leads with", "zxcvb",
    [["DEATH","death or fatal harm"],["SCANDAL","wrongdoing, arrest, disgrace"],["DEFEAT","loss in contest/election"],["ACCIDENT","unintentional harm"],["HARDSHIP","illness, poverty, layoffs, ongoing difficulty"]]]];

const HELP_C = `<p><b>Every post describes a misfortune.</b> Label how the <b>commenter</b> reacts to it. Read the post first, then the comment in its context. Watch sarcasm, irony, emojis (&#128514;&#129315; often = amusement; &#10084;&#65039;&#128546;&#128591; often = sympathy).</p>
<p><b>Hard cases:</b> pleasure + insult together &rarr; SCH (any real enjoyment wins over HOS). "Deserved it" flat &rarr; HOS; with glee &rarr; SCH. A bare &#128514; on a misfortune post &rarr; SCH. Laughing at the headline wording, not the victims &rarr; NEU. Sarcastic sympathy ("oh no, the poor billionaire &#128580;") &rarr; SCH. Political point-scoring without joy &rarr; HOS; with &#128514;&#128514; &rarr; SCH. Language you can't read &rarr; UNK.</p>
<p>Work independently; don't discuss labels with other annotators. Full guidelines: ANNOTATION-GUIDELINES.md.</p>`;
const HELP_P = `<p>Label the post from its text alone (no comments). Four fields per post; the item advances when all four are set.</p>
<p><b>Topic:</b> pick the domain of the <i>misfortune</i>, not of the people involved — a politician's car crash is PERSONAL, not POLITICAL. <b>Deservedness:</b> how the post frames it, not what you believe. <b>Event class:</b> if two apply, the one the headline leads with. Leave nothing blank; prefer OTHER/NONE over wild guessing.</p>`;

let task = "c";
let idx = { c: 0, p: 0 };
let ann = { c: {}, p: {} };   // c: {i: "SCH"}, p: {i: {topic:..,target:..,deservedness:..,event_class:..}}

function store() { localStorage.setItem("schad_ann_review", JSON.stringify({ ann, idx, who: whoEl.value })); }
function load() {
  try {
    const s = JSON.parse(localStorage.getItem("schad_ann_review") || "{}");
    if (s.ann) ann = s.ann;
    if (s.idx) idx = s.idx;
    if (s.who) whoEl.value = s.who;
  } catch (e) {}
}
const whoEl = document.getElementById("who");
function saveWho() { store(); }

function setTask(t) {
  task = t;
  document.getElementById("tab-c").classList.toggle("active", t === "c");
  document.getElementById("tab-p").classList.toggle("active", t === "p");
  render();
}
function data() { return task === "c" ? PAIRS : POSTS; }
function nDone() {
  if (task === "c") return Object.keys(ann.c).length;
  return Object.values(ann.p).filter(a => PFIELDS.every(f => a[f[0]])).length;
}
function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }

function render() {
  const D = data(), i = idx[task], row = D[i];
  document.getElementById("bar").style.width = (100 * nDone() / D.length) + "%";
  document.getElementById("count").textContent = `Item ${i + 1} of ${D.length} — ${nDone()} labeled`;
  document.getElementById("done").textContent = nDone() === D.length ? "All done — click Export CSV and email the file back." : "";
  document.getElementById("jump").value = i + 1;
  document.getElementById("helpbody").innerHTML = task === "c" ? HELP_C : HELP_P;
  let h = "";
  if (task === "c") {
    h += `<div class="card"><div class="k">News post</div><div class="txt">${esc(row.post_text)}</div>
          <div class="meta">${esc(row.source)} · ${esc(row.country)} · ${esc(row.year)}</div></div>`;
    h += `<div class="card"><div class="k">Comment — label how the commenter reacts to the misfortune</div><div class="txt">${esc(row.comment_text)}</div></div>`;
    const g = LLM_C && LLM_C[i];
    h += `<div class="opts">` + CLABELS.map(([l, d], k) =>
      `<div class="opt ${ann.c[i] === l ? "sel" : ""}${g === l ? " llm" : ""}" onclick="pickC('${l}')"><b>${k + 1} · ${l}</b><br><small>${d}</small></div>`).join("") + `</div>`;
    document.getElementById("keyhint").innerHTML = "Keys: <kbd>1</kbd>–<kbd>5</kbd> label &amp; advance, <kbd>&larr;</kbd><kbd>&rarr;</kbd> navigate";
  } else {
    h += `<div class="card"><div class="k">News post — label from the text alone</div><div class="txt">${esc(row.post_text)}</div></div>`;
    const a = ann.p[i] || {}, gp = LLM_P && LLM_P[i];
    for (const [f, title, keys, opts] of PFIELDS) {
      h += `<div class="field-label">${title}</div><div class="opts">` + opts.map(([l, d], k) =>
        `<div class="opt ${a[f] === l ? "sel" : ""}${gp && gp[f] === l ? " llm" : ""}" onclick="pickP('${f}','${l}')"><b>${keys[k].toUpperCase()} · ${l}</b><br><small>${d}</small></div>`).join("") + `</div>`;
    }
    document.getElementById("keyhint").innerHTML = "Keys: <kbd>1-9</kbd> topic, <kbd>Q-R</kbd> target, <kbd>A-D</kbd> deservedness, <kbd>Z-B</kbd> event, <kbd>&larr;</kbd><kbd>&rarr;</kbd> navigate";
  }
  document.getElementById("item").innerHTML = h;
}

function pickC(l) { ann.c[idx.c] = l; store(); move(1); }
function pickP(f, l) {
  const i = idx.p;
  ann.p[i] = ann.p[i] || {};
  ann.p[i][f] = l;
  store();
  if (PFIELDS.every(fd => ann.p[i][fd[0]])) move(1); else render();
}
function move(d) { idx[task] = Math.min(data().length - 1, Math.max(0, idx[task] + d)); store(); render(); }
function jumpTo(v) { idx[task] = Math.min(data().length - 1, Math.max(0, (parseInt(v) || 1) - 1)); store(); render(); }

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowLeft") return move(-1);
  if (e.key === "ArrowRight") return move(1);
  const k = e.key.toLowerCase();
  if (task === "c") {
    const n = parseInt(k);
    if (n >= 1 && n <= 5) pickC(CLABELS[n - 1][0]);
  } else {
    for (const [f, , keys, opts] of PFIELDS) {
      const p = keys.indexOf(k);
      if (p >= 0) return pickP(f, opts[p][0]);
    }
  }
});

function csvCell(v) { v = v == null ? "" : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function exportCSV() {
  const who = (whoEl.value || "").trim();
  if (!who) { alert("Enter your name (top right) before exporting."); return; }
  const missing = data().length - nDone();
  if (missing > 0 && !confirm(`${missing} item(s) in this part are still unlabeled. Export anyway?`)) return;
  let cols, rows, fname;
  const slug = who.toLowerCase().replace(/[^a-z0-9]+/g, "_");
  if (task === "c") {
    cols = ["pair_id", "post_id", "source", "country", "year", "post_text", "comment_text", "label", "annotator"];
    rows = PAIRS.map((r, i) => cols.map(c => c === "label" ? (ann.c[i] || "") : c === "annotator" ? who : r[c]));
    fname = `annotation_comments_${slug}.csv`;
  } else {
    cols = ["post_id", "post_text", "topic", "target", "deservedness", "event_class", "annotator"];
    rows = POSTS.map((r, i) => cols.map(c => {
      if (c === "annotator") return who;
      if (["topic", "target", "deservedness", "event_class"].includes(c)) return (ann.p[i] || {})[c] || "";
      return r[c];
    }));
    fname = `annotation_posts_${slug}.csv`;
  }
  const csv = [cols.join(",")].concat(rows.map(r => r.map(csvCell).join(","))).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
  a.download = fname;
  a.click();
}

load(); render();
</script>
