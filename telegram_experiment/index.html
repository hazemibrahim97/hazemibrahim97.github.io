<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Experiment Preview</title>
<style>
:root{--bg:#e7ebf0;--card:#fff;--ink:#0f1419;--muted:#707579;--accent:#3390ec;--chip:#eef3f8;--line:#dfe3e8;--hdr:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0e1621;--card:#182533;--ink:#f5f5f5;--muted:#8a9ba8;--accent:#6ab2f2;--chip:#22303f;--line:#26374a;--hdr:#17212b}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.page{display:none}.page.on{display:block}
.box{background:var(--card);border-radius:14px;padding:18px 18px 14px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.08)}
h2{margin:.2em 0 .6em;font-size:20px}
label{display:block;margin:12px 0 4px;font-weight:600}
select,input[type=number],input[type=text]{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.btn{display:block;width:100%;margin:16px 0 4px;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:600 16px/1 inherit;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.scale{display:flex;justify-content:space-between;gap:4px;flex-wrap:wrap}
.scale label{font-weight:400;margin:0;flex:1;text-align:center;min-width:36px;padding:6px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.scale input{display:none}.scale input:checked+span{color:var(--accent);font-weight:700}
.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
input[type=range]{width:100%}
.val{color:var(--accent);font-weight:700}
.note{color:var(--muted);font-size:13px}
/* ---- Telegram clone ---- */
.tghdr{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;background:var(--hdr);padding:10px 16px;border-bottom:1px solid var(--line)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.tghdr .t{font-weight:700}.tghdr .s{color:var(--muted);font-size:13px}
.post{background:var(--card);border-radius:12px 12px 12px 4px;padding:10px 12px 6px;margin:14px 0 6px;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.post .ch{color:var(--accent);font-weight:700;font-size:14px}
.meta{display:flex;justify-content:flex-end;gap:10px;color:var(--muted);font-size:12px;margin-top:4px}
.reacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.reacts span{background:var(--chip);border-radius:14px;padding:2px 9px;font-size:13px}
.thread{background:var(--card);border-radius:12px;padding:6px 10px;margin-bottom:12px}
.thread h4{margin:6px 2px 8px;font-size:14px;color:var(--muted)}
.cm{display:flex;gap:8px;margin:8px 0}
.cm .av{width:32px;height:32px;font-size:13px}
.bub{background:var(--chip);border-radius:12px 12px 12px 4px;padding:6px 10px;max-width:85%}
.bub .n{font-weight:700;font-size:13px}
.bub .r{color:var(--muted);font-size:12px;margin-top:2px}
.pager{color:var(--muted);text-align:center;font-size:13px;margin-top:8px}
.pick{display:flex;gap:8px;align-items:flex-start;font-weight:400;border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0}
.banner{background:#fff3cd;color:#664d03;border-radius:8px;padding:6px 10px;font-size:13px;margin:8px 0}

.bar{position:sticky;top:0;z-index:9;background:var(--hdr);border-bottom:1px solid var(--line);padding:10px 16px;display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (max-width:560px){.bar{grid-template-columns:1fr}}
.bar label{margin:0 0 2px;font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:6px;color:#fff}
.t-organic{background:#2e7d4f}.t-real{background:#c0392b}.t-translated{background:#b3541e}.t-ai{background:#6c3fb5}
.info{background:var(--card);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:13px;color:var(--muted);white-space:pre-line}
.bub{white-space:pre-line}.post div{white-space:pre-line}
.warn{background:#fff3cd;color:#664d03;border-radius:8px;padding:8px 10px;font-size:13px;margin:10px 0}
.q{margin:12px 0}.q b{display:block;margin-bottom:4px}.opts{color:var(--muted);font-size:13px}
.tghdr{position:static}
</style></head><body>

йцікавіше ????у квитанціях суми за електрику не зменшуються😁🤣", "reactions": {"👍": 17}}, {"id": "s02-uk-o10", "name": "Ганна_ua", "text": "Міндіч-ітоги,5 \"патужних\" топ менеджерів", "reactions": {"👍": 1}}, {"id": "s02-uk-o11", "name": "Микола", "text": "Спасибі потужній команді потужного президента за зведення потужного захисту в карманах міндіча", "reactions": {"👍": 3}}, {"id": "s02-uk-o12", "name": "Юрій С.", "text": "Якщо проблеми із світлом , чому в квартирах і будинках немає світла , а фонарі горять по всіх вулицях ???😡", "reactions": {"👍": 2}}, {"id": "s02-uk-o13", "name": "Олег С.", "text": "А у нас сяють всі вулиці", "reactions": {"👍": 17}}, {"id": "s02-uk-o14", "name": "Андрій", "text": "Щоб покращити ситуацію зі світлом потрібна децентралізація. Чому в країні нема программ і фінансуванню на установку міні ветряків,міні котелень і сонячних батарей????? Але ж це вихід!!!", "reactions": {"👍": 14}}, {"id": "s02-uk-o15", "name": "Наталія_ua", "text": "Ніхто не притримується графіка , немає світла уже 12годин.", "reactions": {"👍": 17}}, {"id": "s02-uk-o16", "name": "Сергій М.", "text": "В 22 році коли була напруга 180 вольт то був дефіцит напруги а зарам 220 ~225 і вимикають то це вже якісь махінації", "reactions": {"👍": 20}}, {"id": "s02-uk-o17", "name": "Вікторія_ua", "text": "Ухилянтам світло непотрібне… шоб не зрадойобили тут", "reactions": {"👍": 3}}, {"id": "s02-uk-o18", "name": "Ганна", "text": "Знаємо ситуацію брехуни  від ваших співробітників так що не старайтесь  🤡👌", "reactions": {"👍": 21}}, {"id": "s02-uk-o19", "name": "Олег_ua", "text": "ПОТРІБНО МІНДІЧА ПОВЕРНУТИ !!!! ТАК ТАК 73%", "reactions": {"👍": 3}}, {"id": "s02-uk-o20", "name": "Тетяна_ua", "text": "У нас все завжди потужно, потужна країна", "reactions": {"👍": 16}}], "ru": [{"id": "s02-ru-o0", "name": "Людмила М.", "text": "Ой а как же щас все работает", "reactions": {"👍": 25}}, {"id": "s02-ru-o1", "name": "Марина К.", "text": "Нужно меньше воровать", "reactions": {"👍": 20}}, {"id": "s02-ru-o2", "name": "Микола_ua", "text": "Щоб Молдові енергії вистачало.", "reactions": {"👍": 5}}, {"id": "s02-ru-o3", "name": "Алла С.", "text": "Це де 16 годин відключення?", "reactions": {"👍": 8}}, {"id": "s02-ru-o4", "name": "Роман", "text": "Днепр по 14 часов...\nЗато западная  все хорошо,, и мир нам не нужен", "reactions": {"👍": 15}}, {"id": "s02-ru-o5", "name": "Богдан", "text": "Щось в Дніпрі і не було цього покращення якось...((", "reactions": {"👍": 15}}, {"id": "s02-ru-o6", "name": "Ірина С.", "text": "Розмовляю постійно з товаришами з Івано-Франківська, Львова, Тернополя, вони взагалі за останній місяць не знають що таке вимкнення світла", "reactions": {"👍": 22}}, {"id": "s02-ru-o7", "name": "Наталія К.", "text": "А як би ви гроші  не тирили,люди б зі світлом були б.", "reactions": {"👍": 16}}, {"id": "s02-ru-o8", "name": "Тарас М.", "text": "А цього пана скільки кондиціонер у дома, та й у якій він  групі черг відключень? Турецькій чи Пляцькій?", "reactions": {"👍": 4}}, {"id": "s02-ru-o9", "name": "Ігор", "text": "В Дніпрі не 16 правда а 12-14", "reactions": {"👍": 7}}, {"id": "s02-ru-o10", "name": "Павло М.", "text": "Ну це жостко, в ІФ 3 години", "reactions": {"👍": 8}}, {"id": "s02-ru-o11", "name": "Максим", "text": "Срач разводить прилезла? На Западной Украине тоже выключают если ты не знала. И в общей сложности люди сидят по 8-10 часов без света. Или у тебя на один час меньше и тебя это коробит?", "reactions": {"👍": 8}}, {"id": "s02-ru-o12", "name": "Тетяна", "text": "Ну шо ви як діти малі? Невже ви готові комусь горло перегризти якшо в якомусь регіоні країни світла на одну- дві години більше чим у вас?", "reactions": {"👍": 5}}, {"id": "s02-ru-o13", "name": "Максим С.", "text": "Ну так тож дяка московитам", "reactions": {"👍": 4}}, {"id": "s02-ru-o14", "name": "Артем К.", "text": "Дякувати,що взагалі хоч так вмикають", "reactions": {"👍": 14}}, {"id": "s02-ru-o15", "name": "Світлана_ua", "text": "І шо? Чи Дніпро самий многострадальний по відключенню світла?", "r ыбрали власть, а теперь видишь ли не нравится раскудахтались тут", "reactions": {"👍": 17}}, {"id": "s06-uk-o28", "name": "Світлана", "text": "Раз беруть медичні дані, то нехай одразу з медичних показань виключають з військового обліку непридатних. А то при ВЛК за 15 хв всі здорові.", "reactions": {"👍": 20}}, {"id": "s06-uk-o29", "name": "Інна С.", "text": "А до дітей депутатів тоже ,чи тільки до простих людей", "reactions": {"👍": 13}}, {"id": "s06-uk-o30", "name": "Віктор К.", "text": "Всім покидькам, які тут проти ТЦК + то ідіть воювати добровільно! Мерзота труслива!", "reactions": {"👍": 7}}, {"id": "s06-uk-o31", "name": "Ігор", "text": "Личные данные тцкунов тоже будут рано или поздно известны.", "reactions": {"👍": 0}}, {"id": "s06-uk-o32", "name": "Артем С.", "text": "И какой долбоеб это придумал? Фашистам раскрывать все данные.", "reactions": {"👍": 12}}, {"id": "s06-uk-o33", "name": "Тетяна_ua", "text": "Вви заїбали вже людей цим тцк.", "reactions": {"👍": 14}}, {"id": "s06-uk-o34", "name": "Вікторія С.", "text": "Оце й захищені особисті дані??? Брешуть собаки!!! Ні, Ні, таке неприпустимо!!!", "reactions": {"👍": 5}}, {"id": "s06-uk-o35", "name": "Наталія К.", "text": "Дуже багато прав ухвалено для людоловів.Чому вони не йдуть на фронт,вони здорові і вгодовані бички", "reactions": {"👍": 17}}, {"id": "s06-uk-o36", "name": "Інна", "text": "А хто такі тцк?щоб брати доступ до персональних даних?", "reactions": {"👍": 9}}], "ru": [{"id": "s06-ru-o0", "name": "Оксана", "text": "Теперь кто будет сливать инфу ТЦК без разрешения владельца будем подавать на тех в суд ,пусть задумаются", "reactions": {"👍": 18}}, {"id": "s06-ru-o1", "name": "Катерина", "text": "Секрет персональных данных? не, не слышал", "reactions": {"👍": 3}}, {"id": "s06-ru-o2", "name": "Андрій С.", "text": "Больше нихрена не отримают?с хуяли о состоянии здоровья?судя как они тягают по улицам людей их здоровье тцкунов вообще не волнует,бабки решают все", "reactions": {"👍": 5}}, {"id": "s06-ru-o3", "name": "Роман С.", "text": "Ще один вид заробітку для тцкунів , злив персональних данних.", "reactions": {"👍": 25}}, {"id": "s06-ru-o4", "name": "Ірина", "text": "Хай молять богу щоб люди не отримали всі дані на ТЦК та ще й під поганий настрій.", "reactions": {"👍": 20}}, {"id": "s06-ru-o5", "name": "Олег", "text": "слава богу что у нас не как на болотах московии, хорошо что у нас демократия и свобода", "reactions": {"👍": 10}}, {"id": "s06-ru-o6", "name": "Ганна С.", "text": "В мене одне питання тільки, а хто ТЦК надав право на збір особистих даних?", "reactions": {"👍": 17}}, {"id": "s06-ru-o7", "name": "Олег_ua", "text": "У многих украинцев семя воюет", "reactions": {"👍": 15}}, {"id": "s06-ru-o8", "name": "Тарас С.", "text": "Вища математика простіша ні розуміння цього", "reactions": {"👍": 22}}, {"id": "s06-ru-o9", "name": "Ігор_ua", "text": "Бо в нас одна земля і Донбас і Капати і Центр ми всі українці", "reactions": {"👍": 0}}, {"id": "s06-ru-o10", "name": "Марина", "text": "Ничего ,посмотрим ,уж лучше кипеш сделать чем просто сидеть и ждать пока упакуют ,это ваше право ,каждый борется как может", "reactions": {"👍": 23}}, {"id": "s06-ru-o11", "name": "Роман М.", "text": "Я лично 2 раза пытался в суд подавать адвокаты все ссутся под себя с этим связываться", "reactions": {"👍": 16}}, {"id": "s06-ru-o12", "name": "Алла С.", "text": "Краще захищати свою країну,а не чекати поки це робить хтось інший", "reactions": {"👍": 25}}, {"id": "s06-ru-o13", "name": "Ганна", "text": "А почему я сидел в окопах, а других это не должно касаться? Я не говорю, что всех подряд, но много таких, которые могут пойти воевать по здоровью, но прячутся. Тцк к тати такие же самые - они прячутся за спинами других", "reactions": {"👍": 5}}]}, "coordinated": {"uk": {"real": [{"id": "c120", "name": "Сергій М.", "text": "Интересно от чего этой информацией отвлекают Украинцев?!", "reactions": {"👍": 14}}, {"id": "c122", "name": "Ірина С.", "text": "А смысл , что бы в головы рядового украинца вкладывать нужную им isation", "time": "08:14", "views": "412K", "reactions": {"👍": 830, "😢": 210}, "post": {"uk": "Або примусова мобілізація, або новий суспільний договір: ті, хто хочуть воювати – б'ються, а хто не хоче – виїжджають з країни, — нардеп Костенко", "ru": "Либо принудительная мобилизация, либо новый общественный договор: те, кто хотят воевать – сражаются, а кто не хочет – уезжают из страны, — нардеп Костенко"}, "organic": {"uk": [{"id": "s07-uk-o0", "name": "Олег С.", "text": "Оплатиш дорожку кожному?", "reactions": {"👍": 25}}, {"id": "s07-uk-o1", "name": "Світлана М.", "text": "Брехня якась, мобілізація це завжди, апріорі примус🤷‍♂😂", "reactions": {"👍": 19}}, {"id": "s07-uk-o2", "name": "Людмила", "text": "Я не виїжджаю,але і на війну-не піду!", "reactions": {"👍": 7}}, {"id": "s07-uk-o3", "name": "Богдан М.", "text": "Пане Костенко,йдіть,та бійтеся,а не сидіть.", "reactions": {"👍": 10}}, {"id": "s07-uk-o4", "name": "Світлана М.", "text": "Да ради бога. Открывайте кордоны .", "reactions": {"👍": 6}}, {"id": "s07-uk-o5", "name": "Наталія_ua", "text": "Депутати і решта продажна шваль на вихід ...", "reactions": {"👍": 6}}, {"id": "s07-uk-o6", "name": "Олег К.", "text": "Ще було б добре щоб зробили спрощену процедуру виходу з громадянства😜😇😍", "reactions": {"👍": 7}}, {"id": "s07-uk-o7", "name": "Віктор М.", "text": "Бог даровал каждому из нас рождение на этой Земле и в этой части ее́ пространства и не одна \"истота\" не имеет права указывать где и как нам жить, ни одна!!!!", "reactions": {"👍": 18}}, {"id": "s07-uk-o8", "name": "Василь М.", "text": "Твій син потрібен країні,до інвалідності правда безумовно 😂", "reactions": {"👍": 4}}, {"id": "s07-uk-o9", "name": "Микола", "text": "Тільки після Костенка", "reactions": {"👍": 14}}, {"id": "s07-uk-o10", "name": "Артем", "text": "Депутат вирішив, кому жити в Україні? Смілива заява, якщо ця новина - правда.", "reactions": {"👍": 23}}, {"id": "s07-uk-o11", "name": "Андрій_ua", "text": "Само понятие мобилизация уже есть принудительное дей : "Ця дія примусова за визначенням,бо людину відривають від її життя не за власним бажанням,а через крайню необхідність для держави", "reactions": {"👍": 13}}, {"id": "s07-uk-o26", "name": "Ірина", "text": "У нас 2млн заброньованих чиновникiв, мусора, сбу, прокуратура, вiйськовi пенсiонери, мусорськi, то чого iх непризвуть якщо необхiно? Ти юра гандон пропогандон.", "reactions": {"👍": 12}}], "ru": [{"id": "s07-ru-o0", "name": "Віктор", "text": "Так не дают выехать) очередь бы была)", "reactions": {"👍": 13}}, {"id": "s07-ru-o1", "name": "Катерина М.", "text": "Ага зараз вся країна виїде", "reactions": {"👍": 12}}, {"id": "s07-ru-o2", "name": "Ігор С.", "text": "Проще уволить Костенко и нанять профессионалов", "reactions": {"👍": 2}}, {"id": "s07-ru-o3", "name": "Сергій К.", "text": "Если разрешат всем уезжать,  то последняя фраза будет \"кто последний выключите свет\".", "reactions": {"👍": 12}}, {"id": "s07-ru-o4", "name": "Василь", "text": "Так откройте границы, а то сами себе противоречите - собираетесь забронированным даже закрыть границу, чтобы не смогли уехать из крїни мрій", "reactions": {"👍": 1}}, {"id": "s07-ru-o5", "name": "Олег", "text": "Они реально опять уверены, что мало кто уедет?уже практика показала 18-22 , что уедут очень много. А что остальным? просто тут передохнуть?", "reactions": {"👍": 16}}, {"id": "s07-ru-o6", "name": "Максим К.", "text": "этот чувак прямо генератор \"блистательных\" фраз", "reactions": {"👍": 3}}, {"id": "s07-ru-o7", "name": "Василь К.", "text": "Не просто виїзд, а конфіскація майна, за яке воює і вмирає хтось інший на користь сімей героїв, також анулювання громадянства. А не просто дати їм виїхати, відсидітися, а після війни приїхати назад", "reactions": {"👍": 15}}, {"id": "s07-ru-o8", "name": "Андрій М.", "text": "А примусова мобілізація буде стосуватися  депутатів і чиновників і їхніх дітей чи все як завжди нехай воюють прості українці , а держморди будуть і далі красти ?", "reactions": {"👍": 25}}, {"id": "s07-ru-o9", "name": "Микола К.", "text": "Воевать должни В первую очередь кто принимал присягу и Каму нету шестидесяти лет Так будет справедливо", "reactions": {"👍": 14}}, {"id": "s07-ru-o10", "name": "Віктор_ua", "text": "Костенко с полицией и тцк на фронт!принудительно))))!!!!", "reactions": {"👍": 5}}, {"id": "s07-ru-o11", "name": "Вікторія М.", "text": "Костенко с диким на фронт", "reactions": {"👍": 15}}, {"id": "s07-ru-o12", "name": "Ганна", "text": "У меня вопрос, что это за Костенко и что он забыл в Раде? С такими заявами уже не первый день уволить к x*ям", "reactions": {"👍": 17}}, {"id": "s07-ru-o13", "name": "Юлія_ua", "text": "Кто рожает таких долбоебов?Зачем они нам?Может просто изгнать их из страны и жить спокойно.", "reactions": {"👍": 4}}, {"id": "s07-ru-o14", "name": "Ганна", "text": "Та только свистните. На границе очередь стоять будет", "reactions": {"👍": 13}}, {"id": "s07-ru-o15", "name": "Олена", "text": "Значить є опит  ,хай йде воює .чого має йти людина ненавчена  воювати ? А навчені ті що давали присягу прикриватись ненавченими.", "reactions": {"👍": 6}}, {"id": "s07-ru-o16", "name": "Лариса_ua", "text": "А податки хто  тоді буде сплачувати? Щоб воювати потрібні гроші.", "reactions": {"👍": 11}}, {"id": "s07-ru-o17", "name": "Світлана", "text": "Так відкрийте кордони,і виїдуть хто не хоче..а ви ставляйте памʼятники своєму потужному,хоч на кожному квадратному метрі🤬", "reactions": {"👍": 14}}, {"id": "s07-ru-o18", "name": "Вікторія С.", "text": "Самому слабо повоювати", "reactions": {"👍": 20}}, {"id": "s07-ru-o19", "name": "Катерина", "text": "Короче, давайте забирайте все майно у тих хто хоче виїхати, відкривайте кордони, а замість нас навезіть пуштунів, бангладешців, ганійців чи як їх там, і буде вам щастя.", "reactions": {"👍": 15}}, {"id": "s07-ru-o20", "name": "Микола", "text": "Попри весь бекграунд мій, якщо тут будуть будувати неосовок чи якусь недолугу автократію на крові патріотів, я оберу для себе інший шлях і іншу країну. І у кожного має бути таке право.", "reactions": {"👍": 9}}, {"id": "s07-ru-o21", "name": "Сергій К.", "text": "Достойний послідувач марьяни безмозглої....", "reactions": {"👍": 21}}, {"id": "s07-ru-o22", "name": "Марина_ua", "text": "А ті хто не хочуть воювати пашуть в три зміни, щоб офіційно допомагати і утримувати тих, хто за них воює!!!!!", "reactions": {"👍": 1}}, {"id": "s07-ru-o23", "name": "Ганна_ua", "text": "Пішов нах чмо соросовське. Будуєш плани по розділу українців, але тебе з твоїм голосом в наступній раді вже не буде.", "reactions": {"👍": 24}}, {"id": "s07-ru-o24", "name": "Микола М.", "text": "Пффф … 👌 ОК 👌 Відкрийте кордони", "reactions": {"👍": 9}}, {"id": "s07-ru-o25", "name": "Марина_ua", "text": "Так здай паспорт і йди возглавляй колону! Воювати не хочеш а грошей хочеться, з вас толку ніякого.", "reactions": {"👍": 18}}, {"id": "s07-ru-o26", "name": "Юрій С.", "text": "Без проблем, выпустите только", "reactions": {"👍": 11}}, {"id": "s07-ru-o27", "name": "Наталія К.", "text": "Некоторые люди не хотят идти на убой", "reactions": {"👍": 12}}, {"id": "s07-ru-o28", "name": "Віктор_ua", "text": "Правильно. Только дети чиновников - тоже. Как в Израиле.", "reactions": {"👍": 16}}, {"id": "s07-ru-o29", "name": "Сергій_ua", "text": "Секретарь парламентского комитета по вопросам национальной безопасности, обороны и разведки. Воевал с 2014 по 2019 год на Донбасе, \"киборг\" Донецкого аеропорта.", "reactions": {"👍": 22}}, {"id": "s07-ru-o30", "name": "Лариса", "text": "В общем человек который многое повидал", "reactions": {"👍": 1}}, {"id": "s07-ru-o31", "name": "Лариса К.", "text": "Он уже воевал на Донбасе и в Донецком аерпорту и принимал  участие в обороне Николаева и прилегающих населенных пунктов.", "reactions": {"👍": 19}}, {"id": "s07-ru-o32", "name": "Людмила_ua", "text": "Ок, по описанному к нему вопросов нет т респект, но то, что он несёт в последние дни - это максимальная некомпетентность, что удивляешься, что он делает на возлагаемой должности", "reactions": {"👍": 17}}, {"id": "s07-ru-o33", "name": "Артем К.", "text": "Также принимал непосредственное участие в обороне Николаева и прилегающих населенных пунктов, освобождении Снигиревки", "reactions": {"👍": 0}}]}, "coordinated": {"uk": {"real": [{"id": "c144", "name": "Тетяна", "text": "Мир вже досить близько, головне не вестись на українську пропаганду\n\nЛюди воювати не хочуть і скоро і не будуть", "reactions": {"👍": 15}}, {"id": "c154", "name": "Дмитро_ua", "text": "Закінчуйте війну, а не видумуйте схеми для знищення українців", "reactions": {"👍": 10}}, {"id": "c155", "name": "Ганна М.", "text": "По плану Зеленского - до останнього Українця! Потерпи ещё немного, ти ж не зрадник!", "reactions": {"👍": 25}}], "translated": [{"id": "c144t", "name": "Марина М.", "text": "Мир вже досить близько, головне не вестись на українську пропаганду\n\nЛюди воювати не хочуть і скоро і не будуть", "reactions": {"👍": 1}}, {"id": "c154t", "name": "Катерина", "text": "Закінчуйте війну, а не видумуйте схеми для знищення українців", "reactions": {"👍": 9}}, {"id": "c155t", "name": "Світлана С.", "text": "За планом Зеленського - до останнього українця! Потерпи ще трохи, ти ж не зрадник!", "reactions": {"👍": 16}}]}, "ru": {"real": [{"id": "c157", "name": "Алла М.", "text": "Иди воюй, а не пиши бред. Из-за таких как ты война не закончится и будет др последнего украинца. Вы не хотите мира. Так вперёд в окоп", "reactions": {"👍": 11}}, {"id": "c159", "name": "Сергій_ua", "text": "Пусть на фронт едут, там договариваться надо, а не в Киеве", "reactions": {"👍": 9}}, {"id": "c164", "name": "Тетяна М.", "text": "ВСУшники гребут без разбора людей с улиц и отправляют на фронт и это по приказу киевской власти, все сделают для того, чтобы не заканчивать конфликт с нашей страной и дальше получать деньги от недружественных нам стран!", "reactions": {"👍": 2}}, {"id": "c165", "name": "Марина М.", "text": "Киеву уже без разницы кого отправлять на фронт, гонят всех подряд, лишь бы конфликт затянуть подольше…", "reactions": {"👍": 9}}]}}, "source": {" const L=(t)=>`<label>${esc(t)}</label>`;
const sel=(n,o,c)=>`<select name="${n}"><option value="">${c}</option>${o.map(x=>`<option>${esc(x)}</option>`).join("")}</select>`;
const rad=(n,a,b,lo,hi)=>`<div class="scale">${Array.from({length:b-a+1},(_,i)=>`<label><input type="radio" name="${n}" value="${a+i}"><span>${a+i}</span></label>`).join("")}</div><div class="ends"><span>${esc(lo)}</span><span>${esc(hi)}</span></div>`;
const sld=(n)=>`<input type="range" name="${n}" min="0" max="100" value="50" oninput="this.nextElementSibling.querySelector('.val').textContent=this.value"><div class="ends"><span>0</span><span class="val">50</span><span>100</span></div>`;
const Q=(s,c)=>L(s[0])+sel("q",s[1],c);
function surveyPre(g){const S=SV[g],c=S.ch;return `<div class="wrap"><div class="warn">${S.warn}</div><form onsubmit="return false"><div class="box"><h2>${S.infoT}</h2>${S.info.map(p=>`<p>${p}</p>`).join("")}<label class="pick"><input type="checkbox"><span>${S.agree}</span></label></div>

<div class="box"><h2>${S.insT}</h2><p>${S.ins}</p><button class="btn" type="button">${S.send}</button></div></form></div>`}
function surveyPost(g){const S=SV[g],c=S.ch,P=(own,oth)=>`<div class="box">${own}<label class="note">${esc(S.ot)}</label>${oth}</div>`,sample=commentsFor(D.conditions.find(x=>x.id==g+"_amplified"),D.stories[0]);
return `<div class="wrap"><div class="warn">${S.warn}</div><form onsubmit="return false"><div class="box"><h2>${S.viewT}</h2><p class="note">${S.noRight}</p>${S.stm.map((t,i)=>`<div class="box"><p><b>«${esc(t)}»</b></p>${L(S.agreeQ)}${rad("a"+i,0,10,S.loA,S.hiA)}${L(S.pct)}${sld("p"+i)}</div>`).join("")}</div>
<div class="box"><h2>${S.moreT}</h2>${P(L(S.th)+sld("th"),sld("th_o"))}${P(Q(S.win,c),sel("q",S.win[1],c))}${P(L(S.pw)+sld("pw"),sld("pw_o"))}${P(L(S.pe)+sld("pe"),sld("pe_o"))}${P(Q(S.vote,c),sel("q",S.vote[1],c))}${S.fig.map((f,i)=>P(L(S.fav+" "+f)+rad("f"+i,1,5,S.loF,S.hiF),rad("f"+i+"o",1,5,S.loF,S.hiF))).join("")}${Q(S.at,c)}</div>
<div class="box"><h2>${S.cT}</h2>${L(S.c1)}${sld("c1")}${L(S.c2)}${sample.map(m=>`<label class="pick"><input type="checkbox"><span>${esc(m.text)}</span></label>`).join("")}</div>
<div class="box"><h2>${S.dT}</h2><p>${S.d0}</p>${S.dArm.map(p=>`<p class="note">${esc(p)}</p>`).join("")}<button class="btn" type="button">${S.send}</button></div></form></div>`}

function draw(){const v=view.value,c=D.conditions.find(x=>x.id==v);document.getElementById("sw").style.visibility=c?"visible":"hidden";
