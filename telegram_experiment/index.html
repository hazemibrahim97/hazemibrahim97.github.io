*{box-sizing:border-box}
body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.page{display:none}.page.on{display:block}

label{display:block;margin:12px 0 4px;font-weight:600}
select,input[type=number],input[type=text]{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.btn{display:block;width:100%;margin:16px 0 4px;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:600 16px/1 inherit;cursor:pointer}

.scale{display:flex;justify-content:space-between;gap:4px;flex-wrap:wrap}

.scale input{display:none}.scale input:checked+span{color:var(--accent);font-weight:700}
.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
input[type=range]{width:100%}
.val{color:var(--accent);font-weight:700}
.note{color:var(--muted);font-size:13px}
/* ---- Telegram clone ---- */
.tghdr{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;background:var(--hdr);padding:10px 16px;border-bottom:1px solid var(--line)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.tghdr .t{font-weight:700}.tghdr .s{color:var(--muted);font-size:13px}
.post{background:var(--card);border-radius:12px 12px 12px 4px;padding:10px 12px 6px;margin:14px 0 6px;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.post .ch{color:var(--accent);font-weight:700;font-size:14px}
.meta{display:flex;justify-content:flex-end;gap:10px;color:var(--muted);font-size:12px;margin-top:4px}
.reacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.reacts span{background:var(--chip);border-radius:14px;padding:2px 9px;font-size:13px}
.thread{background:var(--card);border-radius:12px;padding:6px 10px;margin-bottom:12px}
.thread h4{margin:6px 2px 8px;font-size:14px;color:var(--muted)}
.cm{display:flex;gap:8px;margin:8px 0}
.cm .av{width:32px;height:32px;font-size:13px}
.bub{background:var(--chip);border-radius:12px 12px 12px 4px;padding:6px 10px;max-width:85%}

.bub .r{color:var(--muted);font-size:12px;margin-top:2px}
.pager{color:var(--muted);text-align:center;font-size:13px;margin-top:8px}
.pick{display:flex;gap:8px;align-items:flex-start;font-weight:400;border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0}
.banner{background:#fff3cd;color:#664d03;border-radius:8px;padding:6px 10px;font-size:13px;margin:8px 0}

.bar{position:sticky;top:0;z-index:9;background:var(--hdr);border-bottom:1px solid var(--line);padding:10px 16px;display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (max-width:560px){.bar{grid-template-columns:1fr}}
.bar label{margin:0 0 2px;font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:6px;color:#fff}
.t-organic{background:#2e7d4f}.t-real{background:#c0392b}.t-translated{background:#b3541e}.t-ai{background:#6c3fb5}
.info{background:var(--card);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:13px;color:var(--muted);white-space:pre-line}
.bub{white-space:pre-line}.post div{white-space:pre-line}
.warn{background:#fff3cd;color:#664d03;border-radius:8px;padding:8px 10px;font-size:13px;margin:10px 0}
.q{margin:12px 0}.q b{display:block;margin-bottom:4px}.opts{color:var(--muted);font-size:13px}
.tghdr{position:static}
</style></head><body>

actions": {"👍": 9}}, {"id": "s15-ru-o35", "name": "Юрій", "text": "То есть 2 человека (зять и какой-то тип) это = Трамп?", "reactions": {"👍": 6}}, {"id": "s15-ru-o36", "name": "Наталія М.", "text": "Цей сцикун далі Італії не вилізе!", "reactions": {"👍": 5}}, {"id": "s15-ru-o37", "name": "Тарас", "text": "Всю эту группу разделить и по одному посадить в каждый город как лучшее ПВО. И не выпускать, пока мир не подпишут. Гарантирую: стрелять никто не будет и мир подпишут очень быстро.", "reactions": {"👍": 25}}, {"id": "s15-ru-o38", "name": "Артем С.", "text": "Дать ему гражданство и привязать за ногу в Киеве. Будет лучшее ПВО в мире😆", "reactions": {"👍": 25}}]}, "coordinated": {"uk": {"real": [{"id": "c338", "name": "Світлана С.", "text": "Навещає прифронтові райони, але чи це допоможе Україні? Краще б шукали шляхи до миру", "reactions": {"👍": 1}}, {"id": "c339", "name": "Сергій", "text": "Рятуйте український народ, підпишіть мирний договір з Росією", "reactions": {"👍": 15}}, {"id": "c347", "name": "Катерина", "text": "Ми відчуваємо. Україні потрібен МИР, спокій та злагода.", "reactions": {"👍": 14}}], "translated": [{"id": "c338t", "name": "Ірина С.", "text": "Навещає прифронтові райони, але чи це допоможе Україні? Краще б шукали шляхи до миру", "reactions": {"👍": 19}}, {"id": "c339t", "name": "Дмитро", "text": "Рятуйте український народ, підпишіть мирний договір з Росією", "reactions": {"👍": 8}}, {"id": "c347t", "name": "Лариса", "text": "Ми відчуваємо. Україні потрібен МИР, спокій та злагода.", "reactions": {"👍": 18}}], "ai": [{"id": "s15-ua0", "name": "Юрій С.", "text": "Россия с первого дня говорила что готова к переговорам, это наши всё время отказывались. Теперь вдруг Трамп нужен чтобы они согласились что ли?", "reactions": {"👍": 9}}, {"id": "s15-ua1", "name": "Сергій К.", "text": "Європі вигідно щоб ми воювали далі, їм головне щоб Росію виснажити. А воювати чомусь маємо ми до останнього українця", "reactions": {"👍": 0}}, {"id": "s15-ua2", "name": "Богдан С.", "text": "Тобто тепер про мир заговорили?? А можна було домовитись ще на самому початку і скільки б хлопців були живі... 😔", "reactions": {"👍": 0}}]}, "ru": {"real": [{"id": "c348", "name": "Василь М.", "text": "Я надеюсь, что страны, помогающие Украине вооружением и деньгами, понимают, что они такие же участники российско-украинского конфликта!", "reactions": {"👍": 17}}, {"id": "c349", "name": "Юлія", "text": "я думаю, подобные встречи не обходятся без разговоров об украинском конфликте, что доказывает наше стремление к достижению мира!", "reactions": {"👍": 7}}, {"id": "c350", "name": "Дмитро М.", "text": "Ведут переговоры с чиновниками Украины.\nИ подписывать договор будут не с Зеленским, а с каким-то чиновником.\nВедь украинская легитимная власть закончилась, осталось одно недоразумение...", "reactions": {"👍": 23}}, {"id": "c356", "name": "Юлія_ua", "text": "В Україні дуже багато хороших людей. на різних посадах! Повинні включитися! І іти до миру! Бо по іншому ми просто будемо пилом історії і дуже скоро", "reactions": {"👍": 7}}, {"id": "c358", "name": "Роман_ua", "text": "Прогноз хороший! Но у нас, только дело дойдет до подписания мирного договора, кто-нибудь приедет и скажет: вы воюйте, вы держитесь, а мы вам будем помогать… Украина такое прошла еще в 2022 году….", "reactions": {"👍": 13}}, {"id": "c359", "name": "Роман М.", "text": "Та ясно шо будут. Кому украинцы нужны...КОМУ? ПОДУМАЙТЕ КОМУ МЫ НУЖНЫ??.", "reactions": {"👍": 16}}], "ai": [{"id": "s15-ra0", "name": "Тетяна", "text": "Россия с самого начала говорила про переговоры, а нам рассказывали про победу до конца. Теперь сами зовут американцев чтобы мир выпросить 🙃", "reactions": {"👍": 7}}, {"id": "s15-ra1", "name": "Тарас", "text": "Трамп не дурак, он понимает что Россию не победить, поэтому и давит на Зеленского чтобы соглашался. Просто красиво это подают как 'поддержку'", "reactions": {"👍": 16}}, {"id": "s15-ra2", "name": "Оксана М.", "text": "Сколько раз уже было 'вот-вот мир' и 'приедет поддержать'... Зеленскому выгодна война, пока она идёт — никаких выборов и никаких вопросов куда делись деньги", "reactions": {"👍": 16}}, {"id": "s15-ra3", "name": "Артем С.", "text": "А вибори коли? Мирну угоду має підписувати легітимна влада, а не та що сама собі продовжила повноваження", "reactions": {"👍": 13}}, {"id": "s15-ra4", "name": "Наталія М.", "text": "Главное чтобы в соглашении было про защиту русского языка и церкви, а то опять подпишут бумажку которую потом сами же нарушат", "reactions": {"👍": 17}}]}}, "source": {"uk_channel": "WARSHAL ✙", "ru_channel": "Инсайдер UA", "uk_date": "2025-12-26", "ru_date": "2025-12-26", "cosine": 0.968, "ru_original": "❗️Трамп может приехать в Украину для поддержки мирного соглашения, — Зеленский в интервью Axios\n\nПо его словам, спецпосланник Белого дома Виткофф и зять президента США Кушнер уже готовы посетить Украину.\n\nПодписаться на INSIDER UA | Прислать контент"}}, {"id": "s18", "topic": "mobilisation", "time": "08:14", "views": "412K", "reactions": {"👍": 830, "😢": 210}, "post": {"uk": "Вам заплатять до 2-х мільйонів грн, якщо підпишете контракт в ЗСУ мінімум на два роки: для мобілізованих вже готується механізм виплат, — нардеп Роман Костенко.", "ru": "Вам заплатят до 2-х миллионов грн, если подпишете контракт с ВСУ минимум на два года: для мобилизованных уже готовится механизм выплат, — нардеп Роман Костенко."}, "organic": {"uk": [{"id": "s18-uk-o0", "name": "Світлана", "text": "Ми не за гроші.За свободу нації", "reactions": {"👍": 20}}, {"id": "s18-uk-o1", "name": "Інна С.", "text": "Хотілося б побачити чергу з полісменів, тцкашників , суддів та прокурорів", "reactions": {"👍": 13}}, {"id": "s18-uk-o2", "name": "Віктор К.", "text": "Хоча б зарплату платили, ви краще воїнам ті що інваліди платіть нормально,", "reactions": {"👍": 7}}, {"id": "s18-uk-o3", "name": "Ігор", "text": "Тоді пропоную коньрактників в кого давним давно закінчився контракт звільнитись", "reactions": {"👍": 0}}, {"id": "s18-uk-o4", "name": "Артем С.", "text": "А чо let QN=0,QP="";const N=()=>`${QP}${++QN}. `;
const L=(t)=>`<label>${N()}${esc(t)}</label>`;
const sel=(n,o,c)=>`<select name="${n}"><option value="">${c}</option>${o.map((x,i)=>`<option>${i+1}. ${esc(x)}</option>`).join("")}</select>`;
const rad=(n,a,b,lo,hi)=>`<div class="scale">${Array.from({length:b-a+1},(_,i)=>`<label><input type="radio" name="${n}" value="${a+i}"><span>${a+i}</span></label>`).join("")}</div><div class="ends"><span>${esc(lo)}</span><span>${esc(hi)}</span></div>`;
const sld=(n)=>`<input type="range" name="${n}" min="0" max="100" step="5" value="50" oninput="this.nextElementSibling.querySelector('.val').textContent=this.value"><div class="ends"><span>0</span><span class="val">50</span><span>100</span></div>`;
const Q=(s,c)=>L(s[0])+sel("q",s[1],c);

<div class="box"><h2>${S.insT}</h2><p>${S.ins}</p><button class="btn" type="button">${S.send}</button></div></form></div>`}
function surveyPost(g){QN=0;QP="B";const S=SV[g],c=S.ch,P=(own,oth)=>`<div class="box">${own}<label class="note">${N()}${esc(S.ot)}</label>${oth}</div>`,sample=commentsFor(D.conditions.find(x=>x.id==g+"_amplified"),D.stories[0]);

<div class="box"><h2>${S.moreT}</h2>${P(L(S.th)+sld("th"),sld("th_o"))}${P(Q(S.win,c),sel("q",S.win[1],c))}${P(L(S.pw)+sld("pw"),sld("pw_o"))}${P(L(S.pe)+sld("pe"),sld("pe_o"))}${P(Q(S.vote,c),sel("q",S.vote[1],c))}${S.fig.map((f,i)=>P(L(S.fav+" "+f)+rad("f"+i,1,5,S.loF,S.hiF),rad("f"+i+"o",1,5,S.loF,S.hiF))).join("")}${Q(S.at,c)}</div>

<div class="box"><h2>${S.dT}</h2><p>${S.d0}</p>${S.dArm.map(p=>`<p class="note">${esc(p)}</p>`).join("")}<button class="btn" type="button">${S.send}</button></div></form></div>`}
