<style>
:root{--bg:#e7ebf0;--card:#fff;--ink:#0f1419;--muted:#707579;--accent:#3390ec;--chip:#eef3f8;--line:#dfe3e8;--hdr:#fff}

*{box-sizing:border-box}
body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.page{display:none}.page.on{display:block}
.box{background:var(--card);border-radius:14px;padding:18px 18px 14px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.08)}
h2{margin:.2em 0 .6em;font-size:20px}
label{display:block;margin:12px 0 4px;font-weight:600}
select,input[type=number],input[type=text]{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.btn{display:block;width:100%;margin:16px 0 4px;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:600 16px/1 inherit;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.scale{display:flex;justify-content:space-between;gap:4px;flex-wrap:wrap}
.scale label{font-weight:400;margin:0;flex:1;text-align:center;min-width:36px;padding:6px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.scale input{display:none}.scale input:checked+span{color:var(--accent);font-weight:700}
.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
input[type=range]{width:100%}
.val{color:var(--accent);font-weight:700}
.note{color:var(--muted);font-size:13px}
/* ---- Telegram clone ---- */
.tghdr{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;background:var(--hdr);padding:10px 16px;border-bottom:1px solid var(--line)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.tghdr .t{font-weight:700}.tghdr .s{color:var(--muted);font-size:13px}
.post{background:var(--card);border-radius:12px 12px 12px 4px;padding:10px 12px 6px;margin:14px 0 6px;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.post .ch{color:var(--accent);font-weight:700;font-size:14px}
.meta{display:flex;justify-content:flex-end;gap:10px;color:var(--muted);font-size:12px;margin-top:4px}
.reacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.reacts span{background:var(--chip);border-radius:14px;padding:2px 9px;font-size:13px}
.thread{background:var(--card);border-radius:12px;padding:6px 10px;margin-bottom:12px}
.thread h4{margin:6px 2px 8px;font-size:14px;color:var(--muted)}
.cm{display:flex;gap:8px;margin:8px 0}
.cm .av{width:32px;height:32px;font-size:13px}
.bub{background:var(--chip);border-radius:12px 12px 12px 4px;padding:6px 10px;max-width:85%}
.bub .n{font-weight:700;font-size:13px}
.bub .r{color:var(--muted);font-size:12px;margin-top:2px}
.pager{color:var(--muted);text-align:center;font-size:13px;margin-top:8px}
.pick{display:flex;gap:8px;align-items:flex-start;font-weight:400;border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0}
.banner{background:#fff3cd;color:#664d03;border-radius:8px;padding:6px 10px;font-size:13px;margin:8px 0}

.bar{position:sticky;top:0;z-index:9;background:var(--hdr);border-bottom:1px solid var(--line);padding:10px 16px;display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (max-width:560px){.bar{grid-template-columns:1fr}}
.bar label{margin:0 0 2px;font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:6px;color:#fff}
.t-organic{background:#2e7d4f}.t-real{background:#c0392b}.t-translated{background:#b3541e}.t-ai{background:#6c3fb5}
.info{background:var(--card);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:13px;color:var(--muted);white-space:pre-line}
.bub{white-space:pre-line}.post div{white-space:pre-line}
.warn{background:#fff3cd;color:#664d03;border-radius:8px;padding:8px 10px;font-size:13px;margin:10px 0}
.q{margin:12px 0}.q b{display:block;margin-bottom:4px}.opts{color:var(--muted);font-size:13px}
.tghdr{position:static}
</style></head><body>

s": {"👍": 5}}, {"id": "s02-ua2", "name": "Наталія К.", "text": "Люди сидять без світла, а нам розповідають про стійкість. Головне питання ніхто не ставить: заради чого це продовжувати такою ціною?", "reactions": {"👍": 17}}]}, "ru": {"real": [{"id": "c36", "name": "Наталія М.", "text": "Скоро мы увидем закат киевского режима, людей и техники у Украины уже почти нет, короче ситуация там патовая", "reactions": {"👍": 17}}, {"id": "c40", "name": "Світлана", "text": "Мне при фамилии Буданова сразу вспоминается, как он, получив приказ от запада, велел участнику украинской делегации в марте 2022 затягивать переговоры по максимум. Время надо было для украинской армии выиграть. А ведь все могло бы уже завершиться и жили бы нормально сейчас((((", "reactions": {"👍": 20}}, {"id": "c41", "name": "Інна С.", "text": "Поскорей надо миром все порешать, чтоб ситуация на Украине на спад пошла, чтоб по Донецку перестали обстрелы вестись, которые с 2014 года не затихают", "reactions": {"👍": 13}}, {"id": "c42", "name": "Віктор К.", "text": "Це тимчасово, та не на довго. Ми тягнемо з капітуляцією, але вона  це єдиний шанс зберегти хоч частигу українців.", "reactions": {"👍": 7}}, {"id": "c45", "name": "Ігор", "text": "Вчера же сказали ... учитывая темпы наступления, рф не особо интересен уже вывод украинских войск с Донбасса. Ща новые выкатят требования и всего делов.", "reactions": {"👍": 0}}, {"id": "c47", "name": "Артем С.", "text": "У Херсоні вже русня, супротиву немає, ВСУ тікають, адміністрація взагалі дістанційно керує. Шеф, усе пропало. Поки чмо збеоетьмя домовлятися, вже буде усе руське.", "reactions": {"👍": 12}}], "ai": [{"id": "s02-ra0", "name": "Інна", "text": "Недели на ремонт, потом новый удар и снова недели. Сколько еще зим так жить? Пока никто не сядет за стол переговоров, это не закончится.", "reactions": {"👍": 9}}, {"id": "s02-ra1", "name": "Оксана", "text": "Энергетику можно чинить бесконечно, но пока идет война, все снова будет разрушено. Лучше бы власть честно сказала людям, чего ждать.", "reactions": {"👍": 18}}, {"id": "s02-ra2", "name": "Катерина", "text": "Люди сидят без света, а им рассказывают про стойкость. А главный вопрос никто не задает: ради чего продолжать такой ценой?", "reactions": {"👍": 3}}, {"id": "s02-ra3", "name": "Андрій С.", "text": "Дело уже не в графиках. Дело в том, что страна платит за затянувшуюся войну своими домами, работой и нервами.", "reactions": {"👍": 5}}, {"id": "s02-ra4", "name": "Роман С.", "text": "Обычные люди это все оплачивают, а решения принимают те, у кого генераторы и охрана. Пора думать о том, как это остановить.", "reactions": {"👍": 25}}, {"id": "s02-ra5", "name": "Ірина", "text": "Каждую зиму обещают, что дальше станет легче, и каждую зиму становится хуже. Может, стоит наконец искать другой выход?", "reactions": {"👍": 20}}]}}, "source": {"uk_channel": "WARSHAL ✙", "ru_channel": "Информатор Украина", "uk_date": "2025-12-06", "ru_date": "2025-12-06", "cosine": 0.949, "ru_original": "❗️Чтобы улучшить ситуацию со светом после последнего удара нужны не дни, а недели, — глава «Укрэнерго» Виталий Зайченко\n\nСейчас отключения продолжаются до 16 часов в сутки.\n\nИнформатор | Подписаться"}}, {"id": "s04", "topic": "energy", "time": "08:14", "views": "412K", "reactions": {"👍": 830, "😢": 210}, "post": {"uk": "Світла у столиці стане більше, – Шмигаль.\n\nСьогодні буде запуск додаткових 9 МВт потужності у Києві, щоб знизити дефіцит.", "ru": "Света в столице станет больше, – Шмыгаль.\n\nСегодня будет запуск дополнительных 9 МВт мощности в Киеве, чтобы снизить дефицит."}, "organic": {"uk": [{"id": "s04-uk-o0", "name": "Олег", "text": "Вы об этом уверены? ㅤ ㅤ", "reactions": {"👍": 10}}, {"id": "s04-uk-o1", "name": "Ганна С.", "text": "Да пишіть, правильно шоб вони знали", "reactions": {"👍": 17}}, {"id": "s04-uk-o2", "name": "Олег_ua", "text": "І нащо таке писати...", "reactions": {"👍": 15}}, {"id": "s04-uk-o3", "name": "Тарас С.", "text": "Нафига об этом писать (", "reactions": {"👍": 22}}, {"id": "s04-uk-o4", "name": "Ігор_ua", "text": "Дякуємо енергетикам і всім причетним, у нас і вранці було і ввечері теж, достатньо.", "reactions": {"👍": 0}}, {"id": "s04-uk-o5", "name": "Марина", "text": "...для Києва. А інші??? 😡", "reactions": {"👍": 23}}, {"id": "s04-uk-o6", "name": "Роман М.", "text": "Завжди після таких заяв рФ провоть пониження потужністі.\nНахріна це писати", "reactions": {"👍": 16}}, {"id": "s04-uk-o7", "name": "Алла С.", "text": "Сподіваємось, у Броварах теж😁", "reactions": {"👍": 25}}, {"id": "s04-uk-o8", "name": "Ганна", "text": "Скільки ж можна вже брехати", "reactions": {"👍": 5}}, {"id": "s04-uk-o9", "name": "Сергій М.", "text": "Интересно у кого больше света 😡😡😡", "reactions": {"👍": 14}}, {"id": "s04-uk-o10", "name": "Ірина С.", "text": "А зачем это писать? сегодня ждать обстрелы?", "reactions": {"👍": 16}}, {"id": "s04-uk-o11", "name": "Ірина_ua", "text": "Bтᴏмили ʜe тᴘyднoщі, ʙтoᴍили ті, xтᴏ ʜаживаєтьcя ʜа ʜиx", "reactions": {"👍": 4}}, {"id": "s04-uk-o12", "name": "Павло", "text": "Напишемо щоб усі знали, і одразу ракети полетять(((", "reactions": {"👍": 19}}, {"id": "s04-uk-o13", "name": "Алла", "text": "Це ʙжᴇ ʜаʙіть ʜᴇ циʜізᴍ. Це плювoᴋ.", "reactions": {"👍": 24}}, {"id": "s04-uk-o14", "name": "Василь М.", "text": "Довбойоб напиши ще адресу!", "reactions": {"👍": 23}}, {"id": "s04-uk-o15", "name": "Павло М.", "text": "Їблани, ми і так зрозуміємо, що світла більше стало...", "reactions": {"👍": 6}}, {"id": "s04-uk-o16", "name": "Максим", "text": "Вы на приколе, это очень мало, это в несколько тысяч раз меньше, чем поступает от АЭС🤦‍♂️", "reactions": {"👍": 20}}, {"id": "s04-uk-o17", "name": "Микола_ua", "text": "Буковель видно отключили.", "reactions": {"👍": 0}}, {"id": "s04-uk-o18", "name": "Артем М.", "text": "9 МВт - это снабжение на 9 многоэтажек.\nНикто мараться не станет...", "reactions": {"👍": 4}}, {"id": "s04-uk-o19", "name": "Олег М.", "text": "Де вони? Світло по 1,5 години на добу в рандомний момент🤦‍♀️", "reactions": {"👍": 15}}, {"id": "s04-uk-o20", "name": "Олег С.", "text": "А Чернигов? Нежин? Конотоп? Сумы? Мена?....", "reactions": {"👍": 25}}, {"id": "s04-uk-o21", "name": "Світлана М.", "text": "Шмигаль дай Шмигнути стежку краще ,потужну ,щоб аж уххххх.", "reactions": {"👍": 19}}, {"id": "s04-uk-o22", "name": "Людмила", "text": "В нас вже 5 суток його немає.\nТо, якщо дати хоча б на 5 хвилин, то його буде більше ніж було", "reactions": {"👍": 7}}, {"id": "s04-uk-o23", "name": "Богдан М.", "text": "Позняки. Світла немає з 7 ранку", "reactions": {"👍": 10}}, {"id": "s04-uk-o24", "name": "Світлана М.", "text": "А про це обов'язково усюди розповідати? Іноді після подібних висказувань таке враження що влада є агентами, давно завербованими?", "reactions": {"👍": 6}}, {"id": "s04-uk-o25", "name": "Наталія_ua", "text": "А в західніх областях по 16 годин немає світла 😡", "reactions": {"👍": 6}}, {"id": "s04-uk-o26", "name": "Олег К.", "text": "І з кожним днем - все більше і більше! Аж до літнього рівнодення! 😁😁😁", "reactions": {"👍": 7}}, {"id": "s04-uk-o27", "name": "Віктор М.", "text": "Бориспіль 1 година за добу, коли буде покращення?", "reactions": {"👍": 18}}, {"id": "s04-uk-o28", "name": "Василь М.", "text": "Шмыгаль сказал,Шмыгаль сделал!🤷🤦🤣", "reactions": {"👍": 4}}, {"id": "s04-uk-o29", "name": "Микола", "text": "А нахуя об этом кричать?", "reactions": {"👍": 14}}, {"id": "s04-uk-o30", "name": "Артем", "text": "Мощность ТЕЦ 5 700 МВт . 9 это пшик", "reactions": {"👍": 23}}, {"id": "s04-uk-o31", "name": "Андрій_ua", "text": "9 мватт 42 9-этажки  можно запитать", "reactions": {"👍": 9}}, {"id": "s04-uk-o32", "name": "Тетяна К.", "text": "І понеслося по всіх каналах😡", "reactions": {"👍": 4}}, {"id": "s04-uk-o33", "name": "Лариса М.", "text": "Для якого хріна про це писати!!!", "reactions": {"👍": 5}}, {"id": "s04-uk-o34", "name": "Дмитро М.", "text": "Та невже???? Більше ніж ніфіга???", "reactions": {"👍": 3}}, {"id": "s04-uk-o35", "name": "Олена М.", "text": "Шмигаль забув точку геолокації прикріпити)))", "reactions": {"👍": 22}}, {"id": "s04-uk-o36", "name": "Лариса К.", "text": "нахуя об этом писать 🫠", "reactions": {"👍": 12}}, {"id": "s04-uk-o37", "name": "Людмила М.", "text": "Поверніть хоч те що було до твого приходу на посаду", "reactions": {"👍": 20}}, {"id": "s04-uk-o38", "name": "Ганна С.", "text": "круто свет на минуту дали спасибо", "reactions": {"👍": 20}}, {"id": "s04-uk-o39", "name": "Сергій М.", "text": "А шо тільки у столиці люди ,а решта то так ,хай сидять по 3 суток без світла", "reactions": {"👍": 15}}], "ru": [{"id": "s04-ru-o0", "name": "Максим К.", "text": "А в Полтавской когда будет свет? 3 часа в сутки это по вашему нормально?", "reactions": {"👍": 17}}, {"id": "s04-ru-o1", "name": "Андрій", "text": "А Днепр??? 2 часа в сутки свет.\nЖесткие графики несколько месяцев!! Когда наша очередь на \"больше света\"?", "reactions": {"👍": 18}}, {"id": "s04-ru-o2", "name": "Дмитро М.", "text": "А в днепропетровской области??", "reactions": {"👍": 21}}, {"id": "s04-ru-o3", "name": "Ігор М.", "text": "По ноздрям запустил ска", "reactions": {"👍": 8}}, {"id": "s04-ru-o4", "name": "Андрій С.", "text": "Ого, а де цифри? Скільки реально запустять? Хз, чи це правда.", "reactions": {"👍": 14}}, {"id": "s04-ru-o5", "name": "Сергій", "text": "О мне как раз дали на 30 секунд свет в 18:30, спасибо мужик", "reactions": {"👍": 13}}, {"id": "s04-ru-o6", "name": "Ірина", "text": "Солнечные панели надо поактивнее", "reactions": {"👍": 12}}, {"id": "s04-ru-o7", "name": "Віктор", "text": "А Полтавская и дальше сидит без света \nУже 22 часа в сутки", "reactions": {"👍": 13}}, {"id": "s04-ru-o8", "name": "Катерина М.", "text": "Брат прости не   буду больше извини что так поступил простите пожалуйста меня", "reactions": {"👍": 12}}, {"id": "s04-ru-o9", "name": "Ігор С.", "text": "Не знаете брат пропал не можем найти", "reactions": {"👍": 2}}, {"id": "s04-ru-o10", "name": "Сергій К.", "text": "А для києва вони стягують світло з інших областей", "reactions": {"👍": 12}}, {"id": "s04-ru-o11", "name": "Василь", "text": "все ще чекаю  пояснень", "reactions": {"👍": 1}}, {"id": "s04-ru-o12", "name": "Олег", "text": "чудове пояснення, грунтовне", "reactions": {"👍": 16}}, {"id": "s04-ru-o13", "name": "Максим К.", "text": "Задоволеним буду якщо хоть дасть нормальне пояснення чому це не можливо про що я написав. А просто казати ще це не так  - ви уподібнюєтесь до капапів", "reactions": {"👍": 3}}, {"id": "s04-ru-o14", "name": "Василь К.", "text": "А де ж обіцяний гігават газової  генерації?", "reactions": {"👍": 15}}, {"id": "s04-ru-o15", "name": "Андрій М.", "text": "Якщо ви писали запереченнЯя на мої дуцмки то ви повинні були знати у чому полягає суть заперечень. Тоді у мене виникає сумнів у вас як у людині а не боті", "reactions": {"👍": 25}}, {"id": "s04-ru-o16", "name": "Микола К.", "text": "А що Київ у нас прифронтове місто?Суми по 48 годин без світла.", "reactions": {"👍": 14}}, {"id": "s04-ru-o17", "name": "Віктор_ua", "text": "коли схід буде з світлом", "reactions": {"👍": 5}}, {"id": "s04-ru-o18", "name": "Вікторія М.", "text": "А Полтава 2~4 години світла на добу, це нормально?", "reactions": {"👍": 15}}, {"id": "s04-ru-o19", "name": "Ганна", "text": "Епт а нах ви коменти видаляєте", "reactions": {"👍": 17}}, {"id": "s04-ru-o20", "name": "Юлія_ua", "text": "При потреблении киева 2000 добавят 9, ух дрбавят так добавят)", "reactions": {"👍": 4}}, {"id": "s04-ru-o21", "name": "Ганна", "text": "Ну от нащо писати про це, запускайте тихенько, так ні, оглашають, щоб обов'язково відслідкували звідки йде?", "reactions": {"👍": 13}}, {"id": "s04-ru-o22", "name": "Олена", "text": "А для Киева они шо заработали???", "reactions": {"👍": 6}}, {"id": "s04-ru-o23", "name": "Лариса_ua", "text": "Мм которые разбиты стоят", "reactions": {"👍": 11}}, {"id": "s04-ru-o24", "name": "Світлана", "text": "Ну так, ты думаешь почему в других областях работают экстренные графики", "reactions": {"👍": 14}}, {"id": "s04-ru-o25", "name": "Вікторія С.", "text": "З таким високим інтелектом як у вас, ви повинні знати про що я запитую, принаймні перечитати моїх попередні повідомлення", "reactions": {"👍": 20}}, {"id": "s04-ru-o26", "name": "Катерина", "text": "У вас он есть а у нас нету не когда даже на 1 секунду", "reactions": {"👍": 15}}, {"id": "s04-ru-o27", "name": "Микола", "text": "В Киеве полтора было в лучшем случае, иногда 2", "reactions": {"👍": 9}}, {"id": "s04-ru-o28", "name": "Сергій К.", "text": "У нас 2 часа ночью. Нашо он мне ночью. И днём 2 раза по пол часа", "reactions": {"👍": 21}}, {"id": "s04-ru-o29", "name": "Марина_ua", "text": "У нас 2 часа ночью. Нашо он мне ночью. И днём 2 раза по пол часа. Продублирую", "reactions": {"👍": 1}}, {"id": "s04-ru-o30", "name": "Ганна_ua", "text": "А коли Львів і вся західна була цілодобово зі світлом то ми так само сиділи по 2 години на добу. А зараз у нас АЕС стали? Ага😁 а до цього не ставали, ну не смішіть, до Молдови продавати АЕС працюють", "reactions": {"👍": 24}}, {"id": "s04-ru-o31", "name": "Микола М.", "text": "Нічого не зрозуміло,але дуже цікаво😄", "reactions": {"👍": 9}}, {"id": "s04-ru-o32", "name": "Марина_ua", "text": "А можно укр мовою,бо я по польські не розумім", "reactions": {"👍": 18}}, {"id": "s04-ru-o33", "name": "Юрій С.", "text": "Та таке враження що тобі років 5 і ти тільки вчишся розмовляти 😁", "reactions": {"👍": 11}}, {"id": "s04-ru-o34", "name": "Наталія К.", "text": "Ти спершу навчись аналізувати написане🤦🏻‍♀️ Ти пишеш шо АЕС стали світла нема. А я пишу шо західна сиділа зі світлом весь час поки схід та центр сидів без світла", "reactions": {"👍": 12}}, {"id": "s04-ru-o35", "name": "Віктор_ua", "text": "В мене такого в хаті не було", "reactions": {"👍": 16}}, {"id": "s04-ru-o36", "name": "Сергій_ua", "text": "Ми користувались туал папером,а не газетами😁", "reactions": {"👍": 22}}, {"id": "s04-ru-o37", "name": "Лариса", "text": "Добре шо в тебе було дитинство з хліб. Мабуть харя нелізе в двері", "reactions": {"👍": 1}}, {"id": "s04-ru-o38", "name": "Лариса К.", "text": "Ти тупо створіння. Я написала біцяні Зе 3000 ракет нічого не казав??", "reactions": {"👍": 12}}, {"id": "s05-uk-o6", "name": "Наталія М.", "text": "Всі говорять про масовані атаки на інфраструктури, А ХТО ЩО РОБИТЬ, ЩОБ ЦЬОГО НЕ ВІДБУЛОСЬ ????", "reactions": {"👍": 0}}, {"id": "s05-uk-o7", "name": "Ігор М.", "text": "І шо?\nБуде по любому. Теж мені оракул", "reactions": {"👍": 5}}, {"id": "s05-uk-o8", "name": "Інна М.", "text": "Або післязавтра, або після-післязавтра, або в будь який день.  Дууууже цінне повідомлення...", "reactions": {"👍": 13}}, {"id": "s05-uk-o9", "name": "Ганна М.", "text": "Або післязавтра, або у вівторок, середу........ за.бали і що, чим він нам допоміг цим?", "reactions": {"👍": 23}}, {"id": "s05-uk-o10", "name": "Сергій К.", "text": "О, ще один виліз. Зараз ще розкаже, що в усьому винні кляті ухилянти", "reactions": {"👍": 8}}, {"id": "s05-uk-o11", "name": "Лариса", "text": "Мінліча за яйця і на вишку", "reactions": {"👍": 0}}, {"id": "s05-uk-o12", "name": "Оксана К.", "text": "Koли цe ʙсᴇ ʙжᴇ зaᴋіʜчиться...", "reactions": {"👍": 14}}, {"id": "s05-uk-o13", "name": "Роман", "text": "Все знають напепед і сидять чекають на жертви🤔", "reactions": {"👍": 21}}, {"id": "s05-uk-o14", "name": "Сергій", "text": "Заібали … тільки вечір і починаються в усіх пабліках одно і то ж саме \nЩе забули про орєшнік написати", "reactions": {"👍": 22}}, {"id": "s05-uk-o15", "name": "Лариса", "text": "Вже задовбали цілий день чекають і нагнітають про обстріли.для чого чекати обстріли нема що робити чи що", "reactions": {"👍": 11}}, {"id": "s05-uk-o16", "name": "Артем С.", "text": "Кожен день одне й те саме", "reactions": {"👍": 25}}, {"id": "s05-uk-o17", "name": "Тетяна_ua", "text": "Вы все по очереди будете гадать будет - не будет?", "reactions": {"👍": 2}}, {"id": "s05-uk-o18", "name": "Віктор", "text": "Куди і так світла нема цілими днями", "reactions": {"👍": 14}}, {"id": "s05-uk-o19", "name": "Наталія К.", "text": "Валютники правильно рахують !", "reactions": {"👍": 13}}, {"id": "s05-uk-o20", "name": "Максим К.", "text": "Не может быть!!!????", "reactions": {"👍": 8}}, {"id": "s05-uk-o21", "name": "Павло К.", "text": "и так тиждень вже ..", "reactions": {"👍": 24}}, {"id": "s05-uk-o22", "name": "Тетяна_ua", "text": "Йому особисто доклали((((", "reactions": {"👍": 1}}, {"id": "s05-uk-o23", "name": "Микола М.", "text": "Я,не могу поверить!!!", "reactions": {"👍": 3}}, {"id": "s05-uk-o24", "name": "Юлія", "text": "Навіщо знаходити всяких.... і публікувати це на каналі протягом дня?", "reactions": {"👍": 13}}, {"id": "s05-uk-o25", "name": "Ганна_ua", "text": "Ага, новини від розвідки ☀️ ясний потім скаже.", "reactions": {"👍": 17}}, {"id": "s05-uk-o26", "name": "Світлана С.", "text": "Скіко можна людей тримати в жаху, кожний день бахкає.....кожний день прогнозують удари.....та пофуй вже....світла немає, вода по годинам, тепла майже теж немає.....", "reactions": {"👍": 4}}, {"id": "s05-uk-o27", "name": "Юлія", "text": "Головне сказати. А на що вони сподіваються? Що люди з банками з консервацією вийдуть збивати балістичні ракети?", "reactions": {"👍": 9}}, {"id": "s05-uk-o28", "name": "Василь_ua", "text": "Або післязавтра,або в понеділок чи вівторок...", "reactions": {"👍": 21}}, {"id": "s05-uk-o29", "name": "Алла С.", "text": "І цей в ворожбити записався.", "reactions": {"👍": 22}}, {"id": "s05-uk-o30", "name": "Світлана С.", "text": "Третю добу анонсують, не дочекаються ніяк, бо вже звалили в чергові мандри  з країни", "reactions": {"👍": 10}}, {"id": "s05-uk-o31", "name": "Юрій", "text": "лесом иди со своими вещаниями...", "reactions": {"👍": 25}}, {"id": "s05-uk-o32", "name": "Оксана", "text": "\"спісак\" партньорам передали?", "reactions": {"👍": 19}}, {"id": "s05-uk-o33", "name": "Артем М.", "text": "Та задовбали ви вже. Ще один пророк. Ну ми ж всі розуміємо, що будуть, але кожен день каркати, це вже перебор.", "reactions": {"👍": 0}}, {"id": "s05-uk-o34", "name": "Павло", "text": "Внук ванги, оооооо найпророкувший наш, найвеличнійший наш!!!! Надіюсь що не образив, щоб не посадили мене!!!!", "reactions": {"👍": 21}}, {"id": "s05-uk-o35", "name": "Людмила С.", "text": "Ті депутати, кончені. Якісьправидці!", "reactions": {"👍": 16}}, {"id": "s05-uk-o36", "name": "Андрій", "text": "Ідіть в сраку зі своїми передбаченнями", "reactions": {"👍": 24}}, {"id": "s05-uk-o37", "name": "Наталія", "text": "Не розумію, яка вигода владі отак народ лякати. Поясніть?", "reactions": {"👍": 22}}, {"id": "s05-uk-o38", "name": "Віктор С.", "text": "А звідки вони знають? Двушечку не передали?", "reactions": {"👍": 13}}, {"id": "s05-uk-o39", "name": "Людмила_ua", "text": "Забібали. Вже тиждень завтраками годують", "reactions": {"👍": 8}}], "ru": [{"id": "s05-ru-o0", "name": "Юрій М.", "text": "Вставьте уже этому питуху костенку огромное дилдо в сраку", "reactions": {"👍": 0}}, {"id": "s05-ru-o1", "name": "Віктор К.", "text": "А может послезавтра или вообще в течении недели или месяца, но точно возможна🤣🤣🤣", "reactions": {"👍": 20}}, {"id": "s05-ru-o2", "name": "Максим_ua", "text": "Давайте уже...Не томите....", "reactions": {"👍": 17}}, {"id": "s05-ru-o3", "name": "Марина_ua", "text": "Зачем нужна такая власть, которая не способна избежать таких проблем, а допустив их не может прекратить? Не обеспечивает безопасность?", "reactions": {"👍": 22}}, {"id": "s05-ru-o4", "name": "Ігор М.", "text": "Кстати интернет в котором ты сидишь, тоже на Западе придумали, а вк в котором ты сидишь, это аналог фейсбука, недоимперский орчонок тупой", "reactions": {"👍": 22}}, {"id": "s05-ru-o5", "name": "Людмила К.", "text": "Сильное оружие 🤣🤣🤣🤣🙈", "reactions": {"👍": 7}}, {"id": "s05-ru-o6", "name": "Дмитро", "text": "То же что и у рф, развитие технологий оставшихся от совка, авиастроение, машиностроение, полный цикл ракетных двигателей для ракет и т.д. у РФ что то по другому? Недоимперец? Только у РФ сколько нефти, а зарплаты во сколько меньше крошечный Японии без ресурсов которая вообще?", "reactions": {"👍": 25}}, {"id": "s05-ru-o7", "name": "Наталія", "text": "До войны не работало?", "reacti }, {"id": "s06-uk-o1", "name": "Катерина_ua", "text": "ТЦК стало як НКВД тридцятих років", "reactions": {"👍": 8}}, {"id": "s06-uk-o2", "name": "Сергій", "text": "Хто вони такі , щоб отримувати доступ до особистих даних українців????", "reactions": {"👍": 16}}, {"id": "s06-uk-o3", "name": "Катерина К.", "text": "А хто такі ТЦК щоб брати без дозволу людини дані?", "reactions": {"👍": 0}}, {"id": "s06-uk-o4", "name": "Василь", "text": "О ботва  раскудахталась.Так надо было делать еще 3, 5 года назад.", "reactions": {"👍": 5}}, {"id": "s06-uk-o5", "name": "Ганна К.", "text": "\"Вся власть ТЦК\" 🤦 (sarcasm)", "reactions": {"👍": 6}}, {"id": "s06-uk-o6", "name": "Віктор С.", "text": "А свої дані не хочуть оприлюднити ?", "reactions": {"👍": 7}}, {"id": "s06-uk-o7", "name": "Олег К.", "text": "До останнього українця...\nДе картонний майдан....", "reactions": {"👍": 8}}, {"id": "s06-uk-o8", "name": "Олена", "text": "До речі, як ПІБ того тцкуна, хто кота вкрав?", "reactions": {"👍": 13}}, {"id": "s06-uk-o9", "name": "Оксана", "text": "Хто вони такі це ОПГ самі настоящі банд формірованіе", "reactions": {"👍": 24}}, {"id": "s06-uk-o10", "name": "Богдан С.", "text": "Геноцид  и согласно какого закона им даётся право брать даные?", "reactions": {"👍": 22}}, {"id": "s06-uk-o11", "name": "Наталія С.", "text": "Уже достало это тцк  может его пора на фронт я военного хоронил работаю в ритуальных услуг да там они скоро формы не будет такой это капец просто я тех знаю", "reactions": {"👍": 13}}, {"id": "s06-uk-o12", "name": "Інна С.", "text": "Бо уебіще недопрезидент дає добро !!", "reactions": {"👍": 7}}, {"id": "s06-uk-o13", "name": "Артем К.", "text": "Теперь кто будет сливать инфу ТЦК без разрешения владельца будем подавать на тех в суд ,пусть задумаются", "reactions": {"👍": 10}}, {"id": "s06-uk-o14", "name": "Василь М.", "text": "А як же захист персональних даних???", "reactions": {"👍": 2}}, {"id": "s06-uk-o15", "name": "Максим К.", "text": "А що їм ті персональні дані дають? Коли людина паспорт отримала? Чи чим і коли хворіла? З'ясувати де знаходиться конкретна людина це на мою думку їм не допоможе.", "reactions": {"👍": 23}}, {"id": "s06-uk-o16", "name": "Сергій", "text": "Північна Корея дзвонила. Просить не копіювати їхній підхід так дослівно.", "reactions": {"👍": 6}}, {"id": "s06-uk-o17", "name": "Юлія К.", "text": "Я не дозволяю розголошувати мої данні. Це моя воля. ТОЧКА!!!", "reactions": {"👍": 1}}, {"id": "s06-uk-o18", "name": "Лариса", "text": "А закон про особисті дані я не давал им разрешения на их использования", "reactions": {"👍": 24}}, {"id": "s06-uk-o19", "name": "Дмитро М.", "text": "А как же защита персональных данных, гарантированная конструкцией.....а не забыл,мы живём в самой \"свободной\" стране....", "reactions": {"👍": 15}}, {"id": "s06-uk-o20", "name": "Катерина С.", "text": "Схуяли тцк будет брать мои мед.данные", "reactions": {"👍": 8}}, {"id": "s06-uk-o21", "name": "Юрій М.", "text": "А Закон \"Про захист персональних даних\" вже скасовано???", "reactions": {"👍": 11}}, {"id": "s06-uk-o22", "name": "Ганна К.", "text": "Це вже занадто нічого особистого вже не має", "reactions": {"👍": 6}}, {"id": "s06-uk-o23", "name": "Ігор", "text": "ТЦК це майбутні вбивці своїх братів, сестер. За гроші продадуть матір рідну.", "reactions": {"👍": 23}}, {"id": "s06-uk-o24", "name": "Віктор М.", "text": "Це ще що таке за новость, що вже взагалі ахірєли", "reactions": {"👍": 25}}, {"id": "s06-uk-o25", "name": "Вікторія С.", "text": "Ми вже ні  на ,що не будем скоро мати права", "reactions": {"👍": 10}}, {"id": "s06-uk-o26", "name": "Юлія_ua", "text": "Причина не тцк а мільйони мільйони боягузів ухилянтів сирунів!!!!", "reactions": {"👍": 24}}, {"id": "s06-uk-o27", "name": "Роман_ua", "text": "А как же тайна персональных данных? А кто такие вообще ТЦК,беспредельщики,убийцы мирного населения.", "reactions": {"👍": 20}}, {"id": "s06-uk-o28", "name": "Богдан", "text": "73 відсоток выбрали власть, а теперь видишь ли не нравится раскудахтались тут", "reactions": {"👍": 22}}, {"id": "s06-uk-o29", "name": "Марина С.", "text": "Раз беруть медичні дані, то нехай одразу з медичних показань виключають з військового обліку непридатних. А то при ВЛК за 15 хв всі здорові.", "reactions": {"👍": 25}}, {"id": "s06-uk-o30", "name": "Богдан", "text": "Не пъиздите про Россию, У нас альплагерь, гето", "reactions": {"👍": 16}}, {"id": "s06-uk-o31", "name": "Олег М.", "text": "А до дітей депутатів тоже ,чи тільки до простих людей", "reactions": {"👍": 7}}, {"id": "s06-uk-o32", "name": "Віктор_ua", "text": "Всім покидькам, які тут проти ТЦК + то ідіть воювати добровільно! Мерзота труслива!", "reactions": {"👍": 22}}, {"id": "s06-uk-o33", "name": "Тарас К.", "text": "Личные данные тцкунов тоже будут рано или поздно известны.", "reactions": {"👍": 17}}, {"id": "s06-uk-o34", "name": "Наталія", "text": "И какой долбоеб это придумал? Фашистам раскрывать все данные.", "reactions": {"👍": 12}}, {"id": "s06-uk-o35", "name": "Павло М.", "text": "Вви заїбали вже людей цим тцк.", "reactions": {"👍": 9}}, {"id": "s06-uk-o36", "name": "Лариса_ua", "text": "Оце й захищені особисті дані??? Брешуть собаки!!! Ні, Ні, таке неприпустимо!!!", "reactions": {"👍": 20}}, {"id": "s06-uk-o37", "name": "Сергій", "text": "Дуже багато прав ухвалено для людоловів.Чому вони не йдуть на фронт,вони здорові і вгодовані бички", "reactions": {"👍": 22}}, {"id": "s06-uk-o38", "name": "Тетяна", "text": "А хто такі тцк?щоб брати доступ до персональних даних?", "reactions": {"👍": 7}}, {"id": "s06-uk-o39", "name": "Вікторія_ua", "text": "Себя охарактеризовал?", "reactions": {"👍": 13}}], "ru": [{"id": "s06-ru-o0", "name": "Артем", "text": "Теперь кто будет сливать инфу ТЦК без разрешения владельца будем подавать на тех в суд ,пусть задумаются", "reactions": {"👍": 21}}, {"id": "s06-ru-o1", "name": "Тарас", "text": "Секрет персональных данных? не, не слышал", "reactions": {"👍": 14}}, {"id": "s06-ru-o2", "name": "Тетяна М.", "text": "Больше нихрена не отримают?с хуяли о состоянии здоровья?судя как они тягают по улицам людей их здоровье тцкунов вообще не волнует,бабки решают все", "reactions": {"👍": 22}}, {"id": "s06-ru-o3", "name": "Наталія", "text": "Ще один вид заробітку для тцкунів , злив персональних данних.", "reactions": {"👍": 3}}, {"id": "s06-ru-o4", "name": "Вікторія С.", "text": "Хай молять богу щоб люди не отримали всі дані на ТЦК та ще й під поганий настрій.", "reactions": {"👍": 12}}, {"id": "s06-ru-o5", "name": "Микола К.", "text": "слава богу что у нас не как на болотах московии, хорошо что у нас демократия и свобода", "reactions": {"👍": 21}}, {"id": "s06-ru-o6", "name": "Юлія М.", "text": "Лачети заберёшь с собой", "reactions": {"👍": 7}}, {"id": "s06-ru-o7", "name": "Марина_ua", "text": "В мене одне питання тільки, а хто ТЦК надав право на збір особистих даних?", "reactions": {"👍": 1}}, {"id": "s06-ru-o8", "name": "Тетяна М.", "text": "Сам говоришь а потом ?", "reactions": {"👍": 22}}, {"id": "s06-ru-o9", "name": "Юрій", "text": "У многих украинцев семя воюет", "reactions": {"👍": 16}}, {"id": "s06-ru-o10", "name": "Тетяна", "text": "Вища математика простіша ні розуміння цього", "reactions": {"👍": 7}}, {"id": "s06-ru-o11", "name": "Богдан", "text": "Я зараз у Львові і ваші жінки тільки і кажуть про новини і про те які ж вони бідні діти на війні чоловік в окопі а самі сидять", "reactions": {"👍": 21}}, {"id": "s06-ru-o12", "name": "Лариса_ua", "text": "Бо в нас одна земля і Донбас і Капати і Центр ми всі українці", "reactions": {"👍": 18}}, {"id": "s06-ru-o13", "name": "Людмила", "text": "Він не витримав і покинув чат 😃😃😃😀😁😁😁🤣🤣😂", "reactions": {"👍": 23}}, {"id": "s06-ru-o14", "name": "Олена К.", "text": "Ничего ,посмотрим ,уж лучше кипеш сделать чем просто сидеть и ждать пока упакуют ,это ваше право ,каждый борется как может", "reactions": {"👍": 5}}, {"id": "s06-ru-o15", "name": "Микола С.", "text": "Я лично 2 раза пытался в суд подавать адвокаты все ссутся под себя с этим связываться", "reactions": {"👍": 23}}, {"id": "s06-ru-o16", "name": "Олег С.", "text": "Краще захищати свою країну,а не чекати поки це робить хтось інший", "reactions": {"👍": 23}}, {"id": "s06-ru-o17", "name": "Віктор", "text": "Ищите других адвокатов ,может женщин", "reactions": {"👍": 7}}, {"id": "s06-ru-o18", "name": "Алла М.", "text": "Была уже и женщина и мужик обещают золотые горы бабки берут, как подходит до дела обсыраются", "reactions": {"👍": 10}}, {"id": "s06-ru-o19", "name": "Артем", "text": "Мої діти там, і їх не гребли,вони самі пішли", "reactions": {"👍": 17}}, {"id": "s06-ru-o20", "name": "Максим", "text": "Вопрос задали ты на войне в окопе ? Что бы ты распоряжалась другими судьбами", "reactions": {"👍": 4}}, {"id": "s06-ru-o21", "name": "Ірина К.", "text": "Якби мене взяли то була би,а не ховалася,щоб інші захищали . А так допомагаю захисникам", "reactions": {"👍": 20}}, {"id": "s06-ru-o22", "name": "Дмитро", "text": "Идёшь в рекрутинговый цент и вступаешь куда хочешь , воюют все", "reactions": {"👍": 22}}, {"id": "s06-ru-o23", "name": "Марина_ua", "text": "Я там , тебе помочь оформится ?", "reactions": {"👍": 19}}, {"id": "s06-ru-o24", "name": "Сергій М.", "text": "Та что на аватарке, при чем здесь это ? Я же тебе говорю рекрутинговый центр", "reactions": {"👍": 0}}, {"id": "s06-ru-o25", "name": "Наталія", "text": "Де там лачеті,розбуй очі, знавець", "reactions": {"👍": 17}}, {"id": "s06-ru-o26", "name": "Тетяна С.", "text": "Ты потерянная ? Ты посмотри с чего ты начала диалог , ты зазываешь на войну и сидишь в тылу , ладно кастрюля занимайся , людей агитировать не нужно", "reactions": {"👍": 16}}, {"id": "s06-ru-o27", "name": "Людмила_ua", "text": "Ты сам видать прячешься от тцк", "reactions": {"👍": 18}}, {"id": "s06-ru-o28", "name": "Артем", "text": "Так ти ще й московит", "reactions": {"👍": 3}}, {"id": "s06-ru-o29", "name": "Тетяна", "text": "Схоже воно по той бік барикад", "reactions": {"👍": 1}}, {"id": "s06-ru-o30", "name": "Микола К.", "text": "Де я посилала? Ану почитай гарно", "reactions": {"👍": 10}}, {"id": "s06-ru-o31" 6, "ru_original": "⚡️Около 35% украинцев доверяют ТЦК. Это много. Этот уровень больше, чем у Верховной Рады и судов, — руководитель Социологической группы \"Рейтинг\"\n\nПодписаться на INSIDER UA | Прислать контент"}}, {"id": "s11", "topic": "western_support", "time": "08:14", "views": "412K", "reactions": {"👍": 830, "😢": 210}, "post": {"uk": "Європа представила план гарантій безпеки для України.\n\nПлан складається із 6 пунктів:\n▪️Постійну військову підтримку України. ЗСУ мають залишатися на рівні до 800 тисяч військових у мирний час для стримування агресії та захисту території.\n\n▪️Багатонаціональну силу Ukraine під проводом Європи. Формується в межах Коаліції рішучих але за підтримки США - для відновлення ЗСУ, захисту неба та безпеки на морі, з можливими діями всередині України.\n\n▪️Механізм контролю припинення вогню. Очолюваний США моніторинг із міжнародною участю - для раннього попередження атак, фіксації порушень і реагування на них.\n\n▪️Юридично зобов’язуючі гарантії безпеки. У разі нового нападу - обов’язок реагувати військовими, розвідувальними, економічними та дипломатичними засобами.\n\n▪️Інвестиції у відновлення України. Фінансування реконструкції, торговельні угоди та компенсація збитків з боку Росії. Російські активи в ЄС залишаються замороженими.\n\n▪️Підтримка вступу України до ЄС", "ru": "Европа представила план гарантий безопасности для Украины.\n\nПлан состоит из 6 пунктов:\n▪️Постоянная военная поддержка Украины. ВСУ должны оставаться на уровне до 800 тысяч военнослужащих в мирное время для сдерживания агрессии и защиты территории.\n\n▪️Многонациональные силы Ukraine под руководством Европы. Формируются в рамках Коалиции решительных, но при поддержке США - для восстановления ВСУ, защиты неба и безопасности на море, с возможными действиями внутри Украины.\n\n▪️Механизм контроля прекращения огня. Возглавляемый США мониторинг с международным участием - для раннего предупреждения атак, фиксации нарушений и реагирования на них.\n\n▪️Юридически обя ,комфортних умовах, а поки відсидимось у безпечній Європі. Ну це справжній патріотизм, тут нема чого казати.", "reactions": {"👍": 10}}, {"id": "s13-uk-o38", "name": "Ігор_ua", "text": "Они все мечтают работать за копейки на стройках?", "reactions": {"👍": 19}}, {"id": "s13-uk-o39", "name": "Оксана", "text": "Война закончится и вернётся половина как минимум", "reactions": {"👍": 12}}], "ru": [{"id": "s13-ru-o0", "name": "Лариса_ua", "text": "Когда  Украина восстановит границу, то они уже не нужны!", "reactions": {"👍": 13}}, {"id": "s13-ru-o1", "name": "Максим", "text": "Ага може ще кордоны 1300року.що за маячня ?пишут всяку чушь.", "reactions": {"👍": 21}}, {"id": "s13-ru-o2", "name": "Ганна С.", "text": "Опитування чисте дно..", "reactions": {"👍": 14}}, {"id": "s13-ru-o3", "name": "Василь", "text": "То есть, те, кто почти четыре года нам поют про патриотизм и при этом мирно сидят в Европе, ставят условия тем, кто все это время в Украине  работает, платит налоги, волонтерит и живет под обстрелами каждый день?!", "reactions": {"👍": 0}}, {"id": "s13-ru-o4", "name": "Інна М.", "text": "А захищати кто буде?", "reactions": {"👍": 18}}, {"id": "s13-ru-o5", "name": "Максим_ua", "text": "Больше половины приедет назад, если зарплаты будут как в ЕС и все", "reactions": {"👍": 1}}, {"id": "s13-ru-o6", "name": "Олена К.", "text": "Пусть едут и восстанавливают,патриоты диванные", "reactions": {"👍": 20}}, {"id": "s13-ru-o7", "name": "Світлана", "text": "А не дох....ра у этих беженцев  запросов?", "reactions": {"👍": 15}}, {"id": "s13-ru-o8", "name": "Богдан", "text": "І ще зп триста тисяч доларів в день", "reactions": {"👍": 4}}, {"id": "s13-ru-o9", "name": "Наталія К.", "text": "Пускай приезжают и восстанавливают!", "reactions": {"👍": 8}}, {"id": "s13-ru-o10", "name": "Роман_ua", "text": "А зачем они вообще нужны?!Пусть батрачат в Европе,пособия же не вечны!?", "reactions": {"👍": 19}}, {"id": "s13-ru-o11", "name": "Ігор К.", "text": "То хай повертаються і вертають кордони.Задовбали", "reactions": {"👍": 21}}, {"id": "s13-ru-o12", "name": "Лариса", "text": "И ещё доллар по 8. \nИдут на х...\nУехали? До побачення", "reactions": {"👍": 17}}, {"id": "s13-ru-o13", "name": "Юрій С.", "text": "Цікаво, а \"Украина восстановит\" це як має відбутися в їх розумінні? Тобто вони не Україна?", "reactions": {"👍": 15}}, {"id": "s13-ru-o14", "name": "Марина", "text": "Добре пи...ть,якщо дупа гріється за кордоном.", "reactions": {"👍": 5}}, {"id": "s13-ru-o15", "name": "Максим С.", "text": "А был ли этот опрос на самом деле? \nИли это очередной вброс для срача между людьми?", "reactions": {"👍": 7}}, {"id": "s13-ru-o16", "name": "Юлія", "text": "Тобто ніхто не повернеться. Нарешті почали це признавати. Хоча порадую. Відсотків 10-15 повернеться, тобто їх звідти \"попросять\", як непотріб.", "reactions": {"👍": 8}}, {"id": "s13-ru-o17", "name": "Андрій К.", "text": "Нехай їдуть повертати", "reactions": {"👍": 11}}, {"id": "s13-ru-o18", "name": "Вікторія", "text": "Мы именно из-за этого не возвращаемся да по-любому😂😂", "reactions": {"👍": 5}}, {"id": "s13-ru-o19", "name": "Ганна К.", "text": "Вернуться к Хасидам,которые ведут себя в Умани,как хозяева?Их власти так защищают,что ни один украинец и не мечтал", "reactions": {"👍": 14}}, {"id": "s13-ru-o20", "name": "Василь М.", "text": "а работать кто будет?", "reactions": {"👍": 13}}, {"id": "s13-ru-o21", "name": "Ірина С.", "text": "Ну а шо вы хотели, истинные патриоты только за границей и живут)", "reactions": {"👍": 18}}, {"id": "s13-ru-o22", "name": "Юрій", "text": "Глянь соц опросы Германии сколько там мужчин готовы защищать 😂", "reactions": {"👍": 22}}, {"id": "s13-ru-o23", "name": "Лариса", "text": "Иногда, так сказать для общего понимания ситуации, читаю общение украинцев в чатах других стран,  и понимаю только одно - Украина  - гудбай, у тех, кто выехал совсем другие проблемы- максимально интеграция в новой стране и назад никто не собирается", "reactions": {"👍": 3}}, {"id": "s13-ru-o24", "name": "Ігор", "text": "Ну і бараб const L=(t)=>`<label>${esc(t)}</label>`;
const sel=(n,o,c)=>`<select name="${n}"><option value="">${c}</option>${o.map(x=>`<option>${esc(x)}</option>`).join("")}</select>`;
const rad=(n,a,b,lo,hi)=>`<div class="scale">${Array.from({length:b-a+1},(_,i)=>`<label><input type="radio" name="${n}" value="${a+i}"><span>${a+i}</span></label>`).join("")}</div><div class="ends"><span>${esc(lo)}</span><span>${esc(hi)}</span></div>`;
const sld=(n)=>`<input type="range" name="${n}" min="0" max="100" value="50" oninput="this.nextElementSibling.querySelector('.val').textContent=this.value"><div class="ends"><span>0</span><span class="val">50</span><span>100</span></div>`;
const Q=(s,c)=>L(s[0])+sel("q",s[1],c);
function surveyPre(g){const S=SV[g],c=S.ch;return `<div class="wrap"><div class="warn">${S.warn}</div><form onsubmit="return false"><div class="box"><h2>${S.infoT}</h2>${S.info.map(p=>`<p>${p}</p>`).join("")}<label class="pick"><input type="checkbox"><span>${S.agree}</span></label></div>
<div class="box"><h2>${S.aboutT}</h2>${L(S.age)}<input type="number" min="18" max="100">${Q(S.gender,c)}${L(S.now)}${sel("o",S.oblast,c)}${L(S.pre)}${sel("o2",S.oblast,c)}${Q(S.idp,c)}${Q(S.lang,c)}${Q(S.inc,c)}${Q(S.tg,c)}</div>
<div class="box"><h2>${S.insT}</h2><p>${S.ins}</p><button class="btn" type="button">${S.send}</button></div></form></div>`}
function surveyPost(g){const S=SV[g],c=S.ch,sample=commentsFor(D.conditions.find(x=>x.id==g+"_amplified"),D.stories[0]);
return `<div class="wrap"><div class="warn">${S.warn}</div><form onsubmit="return false"><div class="box"><h2>${S.viewT}</h2><p class="note">${S.noRight}</p>${S.stm.map((t,i)=>`<div class="box"><p><b>«${esc(t)}»</b></p>${L(S.agreeQ)}${rad("a"+i,0,10,S.loA,S.hiA)}${L(S.pct)}${sld("p"+i)}</div>`).join("")}</div>
<div class="box"><h2>${S.moreT}</h2>${L(S.th)}${sld("th")}${Q(S.win,c)}${L(S.pw)}${sld("pw")}${L(S.pe)}${sld("pe")}${Q(S.vote,c)}${S.fig.map((f,i)=>L(S.fav+" "+f)+rad("f"+i,1,5,S.loF,S.hiF)).join("")}${Q(S.at,c)}</div>
<div class="box"><h2>${S.cT}</h2>${L(S.c1)}${sld("c1")}${L(S.c2)}${sample.map(m=>`<label class="pick"><input type="checkbox"><span>${esc(m.text)}</span></label>`).join("")}</div>
<div class="box"><h2>${S.dT}</h2><p>${S.d0}</p>${S.dArm.map(p=>`<p class="note">${esc(p)}</p>`).join("")}<button class="btn" type="button">${S.send}</button></div></form></div>`}

function draw(){const v=view.value,c=D.conditions.find(x=>x.id==v);document.getElementById("sw").style.visibility=c?"visible":"hidden";
